<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spoiler Free Scores</title>
<meta name="description" content="Too many games. Find the good ones.">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --card:#1c2333; --border:#30363d;
    --text:#e6edf3; --muted:#7d8590;
    --green:#3fb950;  --green-bg:rgba(63,185,80,0.1);
    --blue:#388bfd;   --blue-bg:rgba(56,139,253,0.1);
    --orange:#f0883e; --orange-bg:rgba(240,136,62,0.1);
    --red:#f85149;    --red-bg:rgba(248,81,73,0.1);
    --purple:#bc8cff; --purple-bg:rgba(188,140,255,0.08);
    --esports:#b57bff; --esports-bg:rgba(181,123,255,0.12);
    --yellow:#e3b341; --yellow-bg:rgba(227,179,65,0.1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(255,255,255,0.012) 60px,rgba(255,255,255,0.012) 61px);pointer-events:none;z-index:0;}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 80px;position:relative;z-index:1;}

  header{padding:20px 0 14px;border-bottom:1px solid var(--border);margin-bottom:16px;}
  h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(24px,5vw,40px);letter-spacing:0.04em;line-height:1;white-space:nowrap;}
  h1 .dim{color:var(--muted);} h1 .accent{color:var(--green);}
  .spoiler-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 22px;font-size:13px;font-weight:700;color:var(--text);box-shadow:0 4px 24px rgba(0,0,0,0.5);z-index:200;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;}
  .spoiler-toast.show{opacity:1;}
  .spoiler-toast.toast-error{border-color:var(--red);color:var(--red);background:var(--red-bg);}
  .spoiler-toast.toast-success{border-color:var(--green);color:var(--green);background:var(--green-bg);}
  .spoiler-toast.toast-warn{border-color:var(--orange);color:var(--orange);background:var(--orange-bg);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 2s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

  .loading{text-align:center;padding:60px 20px;color:var(--muted);}
  .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .error-box{background:var(--red-bg);border:1px solid rgba(248,81,73,0.3);border-radius:10px;padding:20px;color:var(--red);font-size:14px;text-align:center;display:none;}

  /* SPORT TABS — base rule overridden below in SCROLLING TABS section.
     Flex-wrap and overflow behavior set there to differentiate desktop
     (nowrap, fits one row) from mobile (wrap, multi-row OK). */
  .sport-tab-divider-placeholder{display:none;}
  /* sport tab styles defined below in scrolling tabs section */

  /* LEGEND */
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .legend-item{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid transparent;}

  /* HOW IT WORKS */
  .how-toggle{background:none;border:none;color:var(--muted);font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;cursor:pointer;padding:0;margin-bottom:16px;display:flex;align-items:center;gap:5px;transition:color 0.15s;}
  .how-toggle:hover{color:var(--text);}
  .how-toggle .arrow{display:inline-block;transition:transform 0.2s;font-size:10px;}
  .how-toggle.open .arrow{transform:rotate(90deg);}
  .how-panel{display:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:20px;}
  .how-panel.open{display:block;}
  .how-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
  .how-item{display:flex;gap:10px;align-items:flex-start;}
  .how-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
  .how-text strong{display:block;font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px;}
  .how-text span{font-size:11px;color:var(--muted);line-height:1.5;}

  /* STATS */
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;flex:1;min-width:70px;text-align:center;}
  .stat-num{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;margin-bottom:2px;}
  .stat-label{font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}

  /* FILTERS — two rows for football */
  .filter-group{margin-bottom:20px;}
  .filter-label{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .filter-btn{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.15s;}
  .filter-btn:hover,.filter-btn.active{background:var(--surface);color:var(--text);border-color:rgba(255,255,255,0.2);}
  .filter-btn.league-active{background:var(--blue-bg);color:var(--blue);border-color:rgba(56,139,253,0.3);}

  /* PERSONALIZE — watch provider setup for WNBA upcoming cards */
  .personalize-btn{background:none;border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'Outfit',sans-serif;display:flex;align-items:center;gap:5px;transition:all 0.15s;}
  .personalize-btn:hover{color:var(--text);border-color:rgba(255,255,255,0.2);}
  .personalize-btn.active{background:var(--blue-bg);color:var(--blue);border-color:rgba(56,139,253,0.3);}
  .personalize-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px;display:none;}
  .personalize-panel.open{display:block;}
  .personalize-title{font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
  .personalize-options{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .personalize-option{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:all 0.15s;user-select:none;font-family:'Outfit',sans-serif;}
  .personalize-option:hover{border-color:rgba(255,255,255,0.2);color:var(--text);}
  .personalize-option.selected{background:var(--blue-bg);color:var(--blue);border-color:rgba(56,139,253,0.3);}
  .personalize-save{background:var(--green);color:#000;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;transition:opacity 0.15s;}
  .personalize-save:hover{opacity:0.85;}
  .personalize-hint{font-size:11px;color:var(--muted);margin-top:10px;}

  /* Watch status tags on upcoming cards */
  .watch-status{font-size:11px;margin-top:4px;display:flex;align-items:center;gap:5px;}
  .watch-status.can-watch{color:var(--green);}
  .watch-status.upgrade{color:var(--orange);}
  .watch-status.no-watch{color:var(--muted);}
  .watch-status a{color:inherit;text-decoration:underline;text-underline-offset:2px;}

  /* SECTION LABEL */
  .section-label{font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;margin-top:24px;display:flex;align-items:center;gap:8px;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--border);}

  /* SKIP COLLAPSE PILL — shown when ≥4 skip games on a date. Click to
     expand the hidden tail. Styled like a Skip card (same bg, border,
     border-radius, muted text) so it sits naturally in the rhythm of
     the card list rather than reading as a separate UI control. */
  .skip-collapse{margin:0 0 9px;}
  .skip-collapse-pill{display:block;width:100%;background:var(--card);border:1px solid var(--border);color:var(--muted);padding:10px 16px;border-radius:12px;font-size:13px;font-family:'Outfit',sans-serif;font-weight:500;cursor:pointer;transition:color 0.15s,border-color 0.15s,background 0.15s;text-align:left;}
  .skip-collapse-pill:hover{color:var(--text);border-color:var(--muted);}

  /* LEAGUE SUBHEADING — inside football tab */
  .league-heading{font-size:13px;font-weight:700;color:var(--blue);margin:28px 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:0.02em;}
  .league-heading::after{content:'';flex:1;height:1px;background:rgba(56,139,253,0.2);}
  .league-heading.world-cup{color:#f0c040;font-size:15px;letter-spacing:0.04em;}
  .league-heading.world-cup::after{background:rgba(240,192,64,0.3);}

  /* UPCOMING DIVIDER */
  .upcoming-divider{display:flex;align-items:center;gap:12px;margin:32px 0 20px;font-size:13px;font-weight:600;color:var(--purple);}
  .upcoming-divider::before,.upcoming-divider::after{content:'';flex:1;height:1px;background:linear-gradient(to right,transparent,rgba(188,140,255,0.3),transparent);}

  /* GAME CARD */
  .game-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:9px;display:flex;align-items:center;gap:14px;transition:transform 0.15s,box-shadow 0.15s;animation:fadeUp 0.35s ease both;position:relative;flex-wrap:nowrap;}
  .game-card:hover{transform:translateX(3px);box-shadow:0 4px 20px rgba(0,0,0,0.3);}

  /* DEBUG MODE */
  .debug-panel{display:none;width:100%;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;font-family:monospace;}
  .debug-mode .debug-panel{display:block;}
  .debug-score{font-weight:700;margin-bottom:6px;color:var(--green);}
  .debug-factor{display:flex;justify-content:space-between;color:var(--muted);padding:1px 0;}
  .debug-factor .pos{color:var(--green);}
  .debug-factor .neg{color:var(--red);}
  .debug-score{font-size:13px;font-weight:700;color:var(--green);margin-bottom:6px;}
  .debug-factor{display:flex;justify-content:space-between;color:var(--muted);padding:1px 0;}
  .debug-factor span:last-child{color:var(--green);}
  .game-card.best-pick{box-shadow:0 0 0 1px rgba(63,185,80,0.25),0 4px 20px rgba(63,185,80,0.1);}
  .best-pick-badge{font-size:10px;font-weight:700;color:var(--green);background:var(--green-bg);border:1px solid rgba(63,185,80,0.25);border-radius:5px;padding:2px 6px;white-space:nowrap;flex-shrink:0;}
  .debug-toast{position:fixed;top:16px;right:16px;background:var(--card);border:1px solid var(--green);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--green);z-index:300;opacity:0;transition:opacity 0.2s;pointer-events:none;}
  .debug-toast.show{opacity:1;}

  /* UPCOMING CARD */
  .upcoming-card{background:var(--purple-bg);border:1px solid rgba(188,140,255,0.2);border-left:3px solid var(--purple)!important;border-radius:12px;padding:14px 18px;margin-bottom:9px;display:flex;align-items:center;gap:14px;animation:fadeUp 0.35s ease both;}
  .upcoming-badge{display:flex;align-items:center;gap:5px;background:rgba(188,140,255,0.12);border:1px solid rgba(188,140,255,0.25);color:var(--purple);padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0;}
  .kickoff-time{font-size:11px;color:var(--purple);font-weight:500;margin-top:2px;}
  /* Broadcast info on upcoming game cards — where to watch. Muted treatment
     so it sits below the matchup/kickoff without competing for attention. */
  .broadcast-info{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .broadcast-sub{color:var(--muted);font-size:10px;opacity:0.8;}
  .collinsworth-warning{font-size:11px;color:var(--orange);background:var(--orange-bg);border-radius:6px;padding:2px 6px;margin-top:3px;display:inline-block;}

  .teams{flex:1;min-width:0;}
  .matchup{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .matchup .vs{color:var(--muted);font-weight:400;margin:0 5px;}
  .game-meta{font-size:11px;color:var(--muted);margin-top:2px;}
  @media(max-width:480px){
    .game-card{padding:12px 14px;gap:10px;}
    /* Match desktop's Skip compaction on mobile too — specificity matches the
       desktop rule, so it wins inside the media query. */
    .game-card.blowout,
    .game-card.defensive{padding:8px 14px;}
    .matchup{font-size:14px;white-space:normal;overflow:visible;text-overflow:unset;line-height:1.3;}
    .game-meta{font-size:12px;}
    .cat-badge{font-size:12px;padding:5px 10px;}
    .reveal-btn{font-size:12px;padding:5px 10px;}
  }

  .cat-badge{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0;}
  .reveal-btn{background:transparent;border:1px solid rgba(255,255,255,0.08);border-radius:7px;padding:4px 10px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background 0.15s,color 0.15s;font-family:'Outfit',sans-serif;}
  .reveal-btn:hover{background:rgba(255,255,255,0.06);color:var(--text);}
  /* Watch Now button — visible only on Must Watch cards. Takes its own full
     row inside the card (flex-basis:100% forces a wrap), making the action
     read as a clear "here's where to watch" callout rather than competing
     with the reveal button for horizontal space. */
  .watch-btn{display:flex;align-items:center;justify-content:center;gap:6px;flex-basis:100%;order:99;background:transparent;border:1px solid rgba(63,185,80,0.35);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--green);text-decoration:none;white-space:nowrap;transition:background 0.15s,border-color 0.15s;font-family:'Outfit',sans-serif;margin-top:4px;}
  .watch-btn--spoiler{border-color:rgba(232,168,56,0.4);color:#e8a838;}
  .watch-btn-warning{font-weight:400;font-size:10px;opacity:0.75;}
  .watch-btn:hover{background:rgba(63,185,80,0.2);border-color:var(--green);}
  .score-reveal{font-size:16px;font-weight:700;font-family:'Bebas Neue',sans-serif;letter-spacing:0.05em;display:none;flex-shrink:0;min-width:52px;text-align:center;}

  .insight-tag--historic { background: rgba(240,192,64,0.12); border-color: rgba(240,192,64,0.4); color: #f0c040; font-style: italic; }

  /* Insight tags — appear when the user taps "Why watch?" before revealing score.
     In game cards (flex-wrap), flex-basis:100% forces a full row. In top-pick-cards
     (block layout), it naturally fills the width. Hidden by default; shown via
     display:flex on cycle. */
  .insight-reveal{display:none;flex-basis:100%;flex-wrap:wrap;gap:6px;margin-top:6px;order:50;align-items:center;}
  .top-pick-card .insight-reveal{margin-top:8px;}
  .insight-tag{display:inline-block;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:4px 9px;font-size:11px;color:var(--muted);font-family:'Outfit',sans-serif;line-height:1.2;}
  .insight-tag--empty{font-style:italic;}
  /* Show Score button inside the insights area. Right-aligned (margin-left:auto)
     so insight tags stay on the left, score CTA on the right. Subtle styling so
     it doesn't shout — the act of revealing the score is deliberate but minor. */
  .insight-score-btn{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,0.12);color:var(--text);font-size:11px;font-family:'Outfit',sans-serif;cursor:pointer;padding:4px 10px;border-radius:6px;transition:background 0.15s,border-color 0.15s;}
  .insight-score-btn:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.2);}
  /* "× hide" affordance inside the insights area. Lets users dismiss
     insights without revealing the score. Deliberately subtle so it
     doesn't compete with the insight tags. */
  .insight-hide{background:transparent;border:none;color:var(--muted);font-size:11px;font-family:'Outfit',sans-serif;cursor:pointer;padding:4px 6px;margin-left:auto;opacity:0.6;transition:opacity 0.15s;}
  .insight-hide:hover{opacity:1;color:var(--text);}

  /* Vote buttons — subtle thumbs up/down on every game card. Used to collect
     anonymous feedback for manual tuning of the categorization engine.
     Designed to be unobtrusive: small, low contrast until interacted with.
     Once a vote is cast, both buttons lock (no re-voting from this device). */
  .vote-btn{background:transparent;border:none;cursor:pointer;font-size:14px;padding:4px 6px;opacity:0.35;transition:opacity 0.15s,transform 0.1s;line-height:1;font-family:inherit;}
  .vote-btn:hover{opacity:0.8;}
  .vote-btn:active{transform:scale(0.92);}
  .vote-btn.voted{opacity:1;}
  .vote-btn.vote-locked{cursor:default;}
  .vote-btn.vote-locked:hover{opacity:inherit;}
  .vote-btn.vote-locked:not(.voted){opacity:0.15;}

  /* Inline reason picker — appears after tapping 👎. Small horizontal list of
     reason pills the user can tap. Tapping a reason submits the vote with
     that reason; tapping × cancels without voting. */
  .vote-reasons{display:none;flex-basis:100%;flex-wrap:wrap;gap:6px;margin-top:8px;order:60;align-items:center;}
  .vote-reasons-label{font-size:11px;color:var(--muted);margin-right:4px;}
  .vote-reason-btn{background:transparent;border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--muted);cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.15s;}
  .vote-reason-btn:hover{background:rgba(255,255,255,0.06);color:var(--text);border-color:rgba(255,255,255,0.2);}
  .vote-reason-cancel{background:transparent;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 6px;opacity:0.5;}
  .vote-reason-cancel:hover{opacity:1;}

  /* Must Watch — green (scorefest + watchworthy both show green) */
  .scorefest  {border-left:3px solid var(--green) !important;}
  .scorefest   .cat-badge{background:var(--green-bg);color:var(--green);border:1px solid rgba(63,185,80,0.25);}
  .scorefest   .score-reveal{color:var(--green);}
  .watchworthy{border-left:3px solid var(--green) !important;}
  .watchworthy .cat-badge{background:var(--green-bg);color:var(--green);border:1px solid rgba(63,185,80,0.25);}
  .watchworthy .score-reveal{color:var(--green);}

  /* Watchable — grey */
  .watchable  {border-left:3px solid var(--muted) !important;}
  .watchable   .cat-badge{background:rgba(125,133,144,0.1);color:var(--muted);border:1px solid rgba(125,133,144,0.2);}
  .watchable   .score-reveal{color:var(--muted);}

  /* Skip — muted red/blue (blowout + defensive both show same) */
  .blowout    {border-left:3px solid rgba(248,81,73,0.4) !important;}
  .blowout     .cat-badge{background:rgba(248,81,73,0.06);color:var(--muted);border:1px solid rgba(248,81,73,0.15);}
  .blowout     .score-reveal{color:var(--muted);}
  .defensive  {border-left:3px solid rgba(248,81,73,0.4) !important;}
  .defensive   .cat-badge{background:rgba(248,81,73,0.06);color:var(--muted);border:1px solid rgba(248,81,73,0.15);}
  .defensive   .score-reveal{color:var(--muted);}

  /* Compact layout for Skip cards. User has been told not to watch — give
     them less screen real estate. Tighter padding, hide date/league subtitle
     (the section date headers and league groupings already place the game). */
  .game-card.blowout,
  .game-card.defensive{padding:10px 16px;}
  .game-card.blowout .matchup,
  .game-card.defensive .matchup{font-size:14px;color:var(--muted);font-weight:500;}
  .game-card.blowout .game-meta,
  .game-card.defensive .game-meta{display:none;}

  /* Sub-reason badge shown inside card */
  .sub-badge{font-size:10px;color:var(--muted);margin-top:2px;}

  .no-games{color:var(--muted);font-size:13px;padding:16px 0;}
  .sport-panel{display:none;}
  .sport-panel.active{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  /* TOP PICKS HERO */
  .top-picks-hero{margin-bottom:32px;}
  .top-picks-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .top-picks-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.06em;color:var(--text);}
  .top-picks-title span{color:var(--yellow);}
  .tp-tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px;}
  .tp-tab{padding:5px 12px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:0.04em;cursor:pointer;border:none;background:transparent;color:var(--muted);font-family:'Outfit',sans-serif;transition:all 0.15s;}
  .tp-tab.active{background:var(--green);color:#000;box-shadow:0 1px 4px rgba(63,185,80,0.4);}
  .tp-tab:hover:not(.active){color:var(--text);}
  .tp-empty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center;}
  .tp-empty a{color:var(--yellow);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:'Outfit',sans-serif;font-size:13px;}
  .tp-empty-suggestion{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;}
  .tp-empty-suggestion span{font-size:13px;color:var(--muted);}
  .tp-suggest-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;font-family:'Outfit',sans-serif;white-space:nowrap;transition:all 0.15s;}
  .tp-suggest-btn:hover{border-color:var(--green);color:var(--green);}
  .top-picks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}

  /* Editorial kicker line above Top Picks — adds curatorial voice when the
     day's situation is notable (loaded week, slim pickings, mixed picks).
     Sits between the section header and the cards; muted to not compete. */
  .tp-editorial{font-size:13px;color:var(--muted);margin-bottom:12px;font-style:italic;letter-spacing:0.01em;}
  .top-pick-card{
    background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:12px 14px;position:relative;overflow:hidden;
    animation:fadeUp 0.3s ease both;cursor:default;
    transition:transform 0.15s,box-shadow 0.15s;
  }
  .top-pick-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,0.35);}
  /* Must Watch — both scorefest and watchworthy use green */
  .top-pick-card.watchworthy{border-left:3px solid var(--green)!important;}
  .top-pick-card.scorefest{border-left:3px solid var(--green)!important;}
  /* Skip — muted */
  .top-pick-card.watchable{border-left:3px solid var(--muted)!important;}
  .top-pick-card.defensive{border-left:3px solid rgba(248,81,73,0.4)!important;}
  .top-pick-card.blowout{border-left:3px solid rgba(248,81,73,0.4)!important;}
  .top-pick-card.best-pick{box-shadow:0 0 0 1px rgba(63,185,80,0.25),0 4px 20px rgba(63,185,80,0.1);}
  .tp-header-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap;}
  .tp-best-pick-badge{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--green);background:transparent;border:1px solid rgba(63,185,80,0.35);border-radius:4px;padding:2px 6px;}
  .tp-best-pick-badge.is-fallback{color:var(--muted);background:rgba(125,133,144,0.1);border-color:rgba(125,133,144,0.25);}
  .tp-sport{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);}
  .tp-matchup{margin-bottom:3px;}
  .tp-team{font-size:14px;font-weight:600;color:var(--text);line-height:1.25;overflow-wrap:break-word;}
  .tp-team-second{font-size:14px;font-weight:600;color:var(--text);line-height:1.25;overflow-wrap:break-word;}
  .tp-vs{color:var(--muted);font-weight:400;margin-right:2px;}
  .tp-meta{font-size:11px;color:var(--muted);margin-bottom:8px;}
  .tp-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:700;margin-bottom:10px;}
  .watchworthy .tp-badge{background:var(--green-bg);color:var(--green);border:1px solid rgba(63,185,80,0.25);}
  .scorefest   .tp-badge{background:var(--green-bg);color:var(--green);border:1px solid rgba(63,185,80,0.25);}
  .watchable   .tp-badge{background:rgba(125,133,144,0.1);color:var(--muted);border:1px solid rgba(125,133,144,0.2);}
  .defensive   .tp-badge{background:rgba(125,133,144,0.1);color:var(--muted);border:1px solid rgba(125,133,144,0.2);}
  .blowout     .tp-badge{background:rgba(125,133,144,0.1);color:var(--muted);border:1px solid rgba(125,133,144,0.2);}
  .tp-reveal{background:transparent;border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.15s;display:block;width:100%;text-align:center;}
  .tp-reveal:hover{background:rgba(255,255,255,0.06);color:var(--text);}

  /* ALL GAMES DIVIDER */

  /* SETTINGS PANEL */

  .sport-toggles{display:flex;gap:8px;flex-wrap:wrap;}
  .sport-toggle{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:12px;font-weight:600;color:var(--text);transition:all 0.15s;user-select:none;}
  .sport-toggle.hidden-sport{opacity:0.4;background:transparent;}
  .sport-toggle:hover{border-color:rgba(255,255,255,0.2);}

  /* SCROLLING TABS — primary sport nav, big and obvious */
  .sport-tabs{display:flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px;scrollbar-width:none;background:var(--surface);flex-wrap:wrap;}

  .sport-tab:not(:last-child){border-right:1px solid var(--border);}
  /* A tab immediately followed by a group divider shouldn't draw its own
     right border — the divider replaces the visual separator. */
  .sport-tab:has(+ .sport-tab-divider){border-right:none;}
  .sport-tab:hover{color:var(--text);background:var(--card);}
  .sport-tab.active{background:var(--card);color:var(--text);box-shadow:inset 0 -2px 0 var(--green);}
  /* Group divider: subtle dot separating identity sports from major sports.
     Sits aligned with tab heights, slightly muted. */
  .sport-tab-divider{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0 8px;color:var(--border);font-size:20px;user-select:none;font-family:'Outfit',sans-serif;line-height:1;}
  .sport-tabs-esports-row{width:100%;display:flex;align-items:stretch;border-top:1px solid var(--border);background:rgba(181,123,255,0.06);}
  .sport-tabs-esports-label{display:flex;align-items:center;padding:0 12px;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--esports);border-right:1px solid var(--border);white-space:nowrap;user-select:none;opacity:0.9;}
  .sport-tabs-offseason-row{width:100%;display:flex;flex-wrap:wrap;align-items:stretch;border-top:1px solid var(--border);}
  .sport-tabs-offseason-label{display:flex;align-items:center;padding:0 12px;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--border);white-space:nowrap;user-select:none;opacity:0.7;}
  .sport-tab.esports{color:var(--muted);}
  .sport-tab.esports:hover{color:var(--esports);background:rgba(181,123,255,0.08);}
  .sport-tab.esports.active{background:rgba(181,123,255,0.1);color:var(--esports);box-shadow:inset 0 -2px 0 var(--esports);}
  .sport-tab.esports.active .tab-count{background:var(--esports-bg);color:var(--esports);}
  .tab-count{background:rgba(255,255,255,0.08);border-radius:10px;padding:1px 6px;font-size:10px;color:var(--muted);font-weight:600;}
  .sport-tab.active .tab-count{background:var(--green-bg);color:var(--green);}

  @media(max-width:560px){
    h1{font-size:clamp(24px,8vw,40px);}
    .game-card{flex-wrap:wrap;gap:10px;padding:14px 14px;}
    .teams{width:100%;}

    .cat-badge{font-size:10px;padding:4px 9px;}

    .upcoming-badge{font-size:10px;padding:4px 9px;}

    .stat{padding:10px 8px;}

    .top-picks-grid{grid-template-columns:1fr;}
    header{padding:16px 0 12px;margin-bottom:14px;}
    .sport-tabs{flex-wrap:wrap;overflow-x:hidden;}
  }
</style>

<body>
<div class="wrap">

        <h1>SPOILER <span class="accent">FREE</span> SCORES</h1>

  <div id="main-content" style="display:none">

    <!-- TOP PICKS HERO -->

      <div class="filters" id="nhl-filters"></div>

    </div>

    <!-- MLB -->
    <div class="sport-panel" id="panel-mlb">
      <div class="filters" id="mlb-filters"></div>

    </div>

    <!-- NBA -->
    <div class="sport-panel" id="panel-nba">
      <div class="filters" id="nba-filters"></div>

    </div>

    <!-- WNBA -->
    <div class="sport-panel" id="panel-wnba">
      <div class="filters" id="wnba-filters"></div>
      <div id="wnba-games"></div>
    </div>

    <!-- NFL -->
    <div class="sport-panel" id="panel-nfl">
      <div class="filters" id="nfl-filters"></div>
      <div id="nfl-games"></div>
    </div>

    <!-- NCAA FOOTBALL (FBS + FCS) -->

      <div class="filter-group" id="ncaaf-filters"></div>
      <div id="ncaaf-games"></div>

      <div class="filters" id="cricket-filters"></div>
      <div id="cricket-games"></div>
    </div>

    <!-- TENNIS -->

      <div class="filters" id="tennis-filters"></div>

    <!-- DARTS -->

      <div class="filters" id="darts-filters"></div>

    </div>

    <!-- SOFTBALL -->

      <div class="filters" id="softball-filters"></div>
      <div id="softball-games"></div>

      <div class="filters" id="cs2-filters"></div>
      <div id="cs2-games"></div>

<script>
  // ── CATEGORY DISPLAY MAPPING ──────────────────────────────────────────
  // cls values drive sorting/filtering internally — labels are what users see
  // badge is the supplementary reason shown under the main label
  const CAT_DISPLAY = {
    scorefest:   { label: 'Must Watch', icon: '👀', cls: 'scorefest',   badge: '🔥 Score Fest'  },
    watchworthy: { label: 'Must Watch', icon: '👀', cls: 'watchworthy', badge: null             },
    watchable:   { label: 'Watchable',  icon: '😐', cls: 'watchable',   badge: null             },
    defensive:   { label: 'Skip',       icon: '⏭',  cls: 'defensive',   badge: '🧱 Flat Game'   },
    blowout:     { label: 'Skip',       icon: '⏭',  cls: 'blowout',     badge: '🎯 Blowout'     },
  };

  function makeCat(cls) {
    return CAT_DISPLAY[cls] || CAT_DISPLAY.watchable;
  }

  // ── CATEGORY RULES ────────────────────────────────────────────────────
  function categorizeFootball(h, a) {
    const total = h+a, diff = Math.abs(h-a);
    if (total >= 6)               return makeCat('scorefest');
    if (total <= 2)               return makeCat('defensive');
    if (diff >= 3)                return makeCat('blowout');
    if (diff === 1 && total >= 4) return makeCat('watchworthy');
    return                               makeCat('watchable');
  }

  const categorizeSoccer = categorizeFootball;

  function categorizeNBA(h, a) {
    const total = h+a, diff = Math.abs(h-a);
    if (total >= 220 && diff <= 7) return makeCat('scorefest');
    if (total <= 200)              return makeCat('defensive');
    if (diff >= 16)                return makeCat('blowout');
    if (diff <= 7)                 return makeCat('watchworthy');
    return                                makeCat('watchable');
  }

  function categorizeWNBA(h, a) {
    // WNBA scoring profile is lower than NBA's. Thresholds scaled ~0.73x.
    const total = h+a, diff = Math.abs(h-a);
    if (total >= 170 && diff <= 5) return makeCat('scorefest');
    if (total <= 140)              return makeCat('defensive');
    if (diff >= 12)                return makeCat('blowout');
    if (diff <= 5)                 return makeCat('watchworthy');
    return                                makeCat('watchable');
  }

  function categorizeNFL(h, a) {
    const total = h+a, diff = Math.abs(h-a);
    if (total >= 50 && diff <= 7) return makeCat('scorefest');
    if (total <= 20)              return makeCat('defensive');
    if (diff >= 17)               return makeCat('blowout');
    if (diff <= 7)                return makeCat('watchworthy');
    return                               makeCat('watchable');
  }

  function categorizeMLB(h, a) {
    const total = h+a, diff = Math.abs(h-a);
    if (total >= 10)              return makeCat('scorefest');
    if (total <= 3)               return makeCat('defensive');
    if (diff >= 4)                return makeCat('blowout');
    if (diff === 1 && total >= 5) return makeCat('watchworthy');
    return                               makeCat('watchable');
  }

  function categorizeNHL(h, a) {
    const total = h+a, diff = Math.abs(h-a);
    if (total >= 8)               return makeCat('scorefest');
    if (total <= 3)               return makeCat('defensive');
    if (diff >= 3)                return makeCat('blowout');
    if (diff === 1 && total >= 4) return makeCat('watchworthy');
    return                               makeCat('watchable');
  }

  // Tennis: categorize by sets won & set scores
  // sets = [{h, a}, ...] — each set's game counts
  function categorizeTennis(homeSets, awaySets, sets) {
    const totalSets = homeSets + awaySets;
    const loserSets = Math.min(homeSets, awaySets);
    // Tiebreak sets — any set decided in a tiebreak (7-6)
    const hasTiebreak = sets.some(s => s.h === 7 || s.a === 7);
    // Close sets: decided by 2 games or fewer (including tiebreaks)
    const closeSets = sets.filter(s => Math.abs(s.h - s.a) <= 2).length;
    // Bagel (6-0) or breadstick (6-1) — dominant
    const hasBagel      = sets.some(s => (s.h === 6 && s.a === 0) || (s.a === 6 && s.h === 0));
    const hasBreadstick = sets.some(s => (s.h === 6 && s.a === 1) || (s.a === 6 && s.h === 1));

    // Epic 5-setter (Grand Slam)
    if (totalSets >= 5) return makeCat('scorefest');

    // Any 3-setter is at least a Must Watch
    if (totalSets >= 3 && loserSets >= 1) return makeCat('watchworthy');

    // Straight sets with tiebreak(s)
    if (loserSets === 0 && hasTiebreak) return makeCat('watchworthy');

    // Dominant straight-set win — bagel or breadstick
    if (loserSets === 0 && (hasBagel || hasBreadstick) && !hasTiebreak)
      return makeCat('blowout');

    // Straight sets, close-ish
    if (loserSets === 0 && closeSets >= 2) return makeCat('watchable');

    // Straight sets, not close
    if (loserSets === 0) return makeCat('blowout');

    return makeCat('watchable');
  }

  const SOCCER_LEAGUES = [
    "Premier League","La Liga","Bundesliga","Serie A",
    "Ligue 1","Champions League","Europa League","MLS"
  ];

  const FILTER_DEFS        = ['all','mustwatch','watchable'];
  const CRICKET_FILTER_DEFS = ['all','mustwatch','watchable'];
  const TENNIS_FILTER_DEFS  = ['all','mustwatch','watchable'];

  // Cumulative filter — each level includes everything above it
  const FILTER_CLS_MAP = {
    mustwatch: ['scorefest','watchworthy'],               // only Must Watch
    watchable: ['scorefest','watchworthy','watchable'],   // Must Watch + Watchable (no Skip)
  };

  // Cricket categorize — works on result margin text, not scores
  function categorizeCricket(resultMargin, resultType, maxInnings) {
    if (maxInnings >= 200) return { ...makeCat('scorefest'), badge: '🏏 200+ score' };
    if (resultType === "runs") {
      if (resultMargin >= 31)       return makeCat('blowout');
      if (resultMargin >= 11)       return makeCat('watchable');
      if (resultMargin !== null)    return makeCat('watchworthy');
    }
    if (resultType === "wickets") {
      if (resultMargin >= 7)        return makeCat('blowout');
      if (resultMargin >= 4)        return makeCat('watchable');
      if (resultMargin !== null)    return makeCat('watchworthy');
    }
    return makeCat('watchable');
  }

  const SPORTS = {
    football: { cat: (h,a) => categorizeFootball(h,a), filterDefs: FILTER_DEFS },
    nhl:      { cat: (h,a) => categorizeNHL(h,a),      filterDefs: FILTER_DEFS },
    mlb:      { cat: (h,a) => categorizeMLB(h,a),      filterDefs: FILTER_DEFS },
    nba:      { cat: (h,a) => categorizeNBA(h,a),       filterDefs: FILTER_DEFS },
    wnba:     { cat: (h,a) => categorizeWNBA(h,a),      filterDefs: FILTER_DEFS },
    nfl:      { cat: (h,a) => categorizeNFL(h,a),      filterDefs: FILTER_DEFS },
    ncaaf:    { cat: (h,a) => categorizeNFL(h,a),      filterDefs: FILTER_DEFS },
    cricket:  { filterDefs: CRICKET_FILTER_DEFS }, // cricket uses its own render path
    tennis:   { filterDefs: TENNIS_FILTER_DEFS  }, // tennis uses its own render path
    darts:    { filterDefs: FILTER_DEFS  }, // darts uses its own render path
    softball: { cat: (h,a) => categorizeMLB(h,a), filterDefs: FILTER_DEFS }, // same categorize as MLB
    cs2:      { cat: (h,a) => ({ cls: 'watchable', score: 0 }), filterDefs: FILTER_DEFS }, // scoring handled by backend
  };

  const FILTER_LABELS = {
    all:'All Matches',
    mustwatch:'👀 Must Watch',
    watchable:'😐 Worth Watching',
  };
  const STD_FILTER_LABELS = {
    all:'All Games',
    mustwatch:'👀 Must Watch',
    watchable:'😐 Worth Watching',
  };

  const STAT_DEFS = {
    football: [
      {key:'scorefest',   label:'Score Fest',    color:'var(--orange)', icon:'🔥'},
      {key:'defensive',   label:'Defensive',     color:'var(--blue)',   icon:'🧱'},

  // A sport counts as "out of season" once we've actually loaded its data
  // and found zero recent AND zero upcoming games. Before data loads (or if
  // a fetch failed), we don't know — so we don't demote it, to avoid tabs
  // jumping around based on transient load state rather than real season status.
  function isOutOfSeason(key) {
    if (key === 'all') return false; // pinned tab, never demoted
    const d = allData[key];
    if (!d) return false;
    return (d.recent?.length || 0) === 0 && (d.upcoming?.length || 0) === 0;
  }

  // Sort key is: esports always last (its own visually distinct row) →
  // season status (in-season sports first, globally — not just within their
  // own identity/major group, since a fan doesn't care that NFL is
  // technically "major" if Darts is in-season and NFL isn't) → otherwise
  // stable, preserving ALL_SPORTS' original identity-before-major ordering.
  function getOrderedSports() {
    return [...ALL_SPORTS].sort((a, b) => {
      const aPinned = a.key === 'all';
      const bPinned = b.key === 'all';
      if (aPinned !== bPinned) return aPinned ? -1 : 1;
      const aEsports = a.group === 'esports';
      const bEsports = b.group === 'esports';
      if (aEsports !== bEsports) return aEsports ? 1 : -1;
      const aOut = isOutOfSeason(a.key);
      const bOut = isOutOfSeason(b.key);
      if (aOut !== bOut) return aOut ? 1 : -1;
      return 0; // stable — preserve original relative order otherwise
    });
  }

  // Load hidden sports from localStorage

  function buildSportTabs() {
    const tabsEl = document.getElementById('sport-tabs');

    // Fall back to first visible sport if saved sport is now hidden
    const visibleSports = getOrderedSports().filter(s => !hiddenSports.has(s.key));
    if (!visibleSports.find(s => s.key === activeSport)) {
      activeSport = visibleSports[0]?.key || 'football';
    }

    // Render tabs with a labeled OFF-SEASON row for out-of-season sports,
    // matching the existing Esports row pattern — season status is the
    // primary sort key, so the old identity/major grouping no longer maps
    // cleanly to a divider; a labeled row reads clearer than a bare dot.
    // The pinned 'all' tab is never out-of-season and never enters either
    // labeled row.
    let html = '';
    let offseasonOpen = false;
    let esportsOpen = false;
    for (const s of visibleSports) {
      if (s.group === 'esports') {
        if (offseasonOpen) { html += '</div>'; offseasonOpen = false; }
        if (!esportsOpen) {
          html += '<div class="sport-tabs-esports-row"><span class="sport-tabs-esports-label">Esports</span>';
          esportsOpen = true;
        }
      } else if (s.key !== 'all' && isOutOfSeason(s.key)) {
        if (!offseasonOpen) {
          html += '<div class="sport-tabs-offseason-row"><span class="sport-tabs-offseason-label">Off-season</span>';
          offseasonOpen = true;
        }
      } else if (offseasonOpen) {
        html += '</div>';
        offseasonOpen = false;
      }
      const esportsCls = s.group === 'esports' ? ' esports' : '';
      html += `<button class="sport-tab${esportsCls} ${s.key === activeSport ? 'active' : ''}" data-sport="${s.key}"
          onclick="switchSport('${s.key}',this)">${s.label}
          <span class="tab-count" id="${s.key}-count">—</span>
        </button>`;
    }
    if (offseasonOpen) html += '</div>';
    if (esportsOpen) html += '</div>';
    tabsEl.innerHTML = html;

    // Show saved sport panel

  // Feedback state: Map of gameId → vote ('up' | 'down'). Backed by localStorage
  // so a user's votes persist across reloads — we don't want them seeing fresh
  // unvoted buttons on games they already voted on. The server is the source
  // of truth for analysis; this is purely a UX cache.
  let votedGames = new Map(JSON.parse(localStorage.getItem('votedGames') || '[]'));

  function saveVotedGames() {
    localStorage.setItem('votedGames', JSON.stringify([...votedGames]));
  }

  // Submit a vote to the server. Optimistic: we update the local UI
  // immediately and only revert on a hard failure. Network/server errors are
  // logged but don't bother the user — this is non-critical metadata.
  async function submitFeedback(game, vote, downReason) {
    const gameId = makeGameId(game);

    // Idempotent guard — don't double-submit from the same device
    if (votedGames.has(gameId)) return;

    // Optimistic local update FIRST so UI feels instant
    votedGames.set(gameId, vote);
    saveVotedGames();

    const payload = {
      gameId,
      sport: game.sport || game._sport || null,
      league: game.league || null,
      home: game.home || null,
      away: game.away || null,
      gameDate: game.date || game.dateStr || null,
      engineCategory: game.cat?.cls || null,
      engineScore: game.confidence?.score ?? null,
      wasTopPick: currentTopPickIds.has(gameId),
      wasBestPick: false,  // best pick state isn't a stable property of the game
      vote,
      downReason: downReason || null,
    };

    try {
      const res = await fetch('/.netlify/functions/submit-feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        console.warn('submit-feedback: server returned', res.status);
        // Don't revert local UI — the user's intent was registered locally.
        // If they retry-vote later we'll send again (won't because votedGames blocks).
      }
    } catch (err) {
      console.warn('submit-feedback: network error', err);
      // Same — don't revert.
    }
  }

  function makeGameId(g) {
    return `${g.home}|${g.away}|${g.date || g.dateStr}`;
  }

  // Vote button click handlers. Both look up the game from the data using the
  // gameId attached to the card, fire submitFeedback, and update UI.
  //
  // 👍 votes are silent — just register and gray out the buttons.
  // 👎 votes show an inline reason picker first; user picks a reason or skips.
  function handleVoteUp(btn) {
    const card = btn.closest('.game-card, .top-pick-card');
    if (!card) return;
    const gameId = card.dataset.gameId;
    const game = findGameById(gameId);
    if (!game) return;
    if (votedGames.has(gameId)) return;

    markCardVoted(card, 'up');
    submitFeedback(game, 'up', null);
  }

  function handleVoteDown(btn) {
    const card = btn.closest('.game-card, .top-pick-card');
    if (!card) return;
    const gameId = card.dataset.gameId;
    if (votedGames.has(gameId)) return;

    // Show inline reason picker. Either user picks a reason, or taps "skip"

  function handleReasonPick(btn, reason) {
    const card = btn.closest('.game-card, .top-pick-card');
    if (!card) return;
    const gameId = card.dataset.gameId;

    if (!game) return;

    // Hide picker
    const picker = card.querySelector('.vote-reasons');

  // Apply voted styling to both thumb buttons in a card. Picked thumb stays
  // bright, other thumb fades.
  function markCardVoted(card, vote) {
    const upBtn = card.querySelector('.vote-up');
    const downBtn = card.querySelector('.vote-down');
    if (!upBtn || !downBtn) return;
    upBtn.classList.add('vote-locked');
    downBtn.classList.add('vote-locked');
    if (vote === 'up')   upBtn.classList.add('voted');
    if (vote === 'down') downBtn.classList.add('voted');
  }

  // Look up a game by its gameId across all loaded sport data. Linear scan
  // but the data set is small (a few hundred games total).
  function findGameById(gameId) {
    for (const sportKey of Object.keys(allData)) {
      const recent = allData[sportKey]?.recent || [];
      for (const g of recent) {
        if (makeGameId(g) === gameId) {
          return { ...g, sport: sportKey, _sport: sportKey };
        }
      }
    }
    return null;
  }


  // ── LAST UPDATED (feature #6) ──────────────────────────────────────────
  let loadedAt = null;

  function updateLastUpdatedText() {
    if (!loadedAt) return;
    const mins = Math.floor((Date.now() - loadedAt) / 60000);
    let txt;
    if (mins < 1)    txt = 'Just updated';
    else if (mins === 1) txt = 'Updated 1 min ago';
    else if (mins < 60)  txt = `Updated ${mins} mins ago`;
    else if (mins < 480) txt = `Updated ${Math.floor(mins/60)}h ago`;
    else                 txt = 'Updated a while ago';
    const el = document.getElementById('last-updated-text');
    if (el) el.textContent = txt;
  }

  // Silent auto-refresh: check every 5 minutes if the blob is newer than
  // what we loaded. If so, silently reload data and re-render.
  // Only refreshes if the page has been visible for at least 2 minutes
  // to avoid disrupting someone actively reading.
  async function checkForNewerBlob() {
    if (!loadedAt) return;
    try {
      const res = await fetch(`/.netlify/functions/get-scores?sport=all&_poll=${Date.now()}`, { method: 'HEAD' });
      const fetchedAtHdr = res.headers.get('X-Fetched-At');
      if (!fetchedAtHdr) return;
      const serverFetchedAt = new Date(fetchedAtHdr).getTime();
      if (serverFetchedAt > loadedAt) {
        await loadScores();
      }
    } catch (e) {
      // Network blip — try again next interval
    }
  }

  setInterval(checkForNewerBlob, 5 * 60 * 1000); // every 5 minutes

  // ── LOAD ───────────────────────────────────────────────────────────────
  // Map from frontend sport key to API response key
  const API_KEY = { football:'soccer', nhl:'nhl', mlb:'mlb', nba:'nba', wnba:'wnba', nfl:'nfl', ncaaf:'ncaaf', cricket:'cricket', tennis:'tennis', darts:'darts', softball:'softball', cs2:'cs2' };

  const TIMELINE_CAT_MAP = {
    scorefest:   makeCat('scorefest'),
    watchworthy: makeCat('watchworthy'),
    defensive:   makeCat('defensive'),
    blowout:     makeCat('blowout'),
    watchable:   makeCat('watchable'),
  };
  const TIMELINE_RANK = { scorefest:4, watchworthy:3, watchable:2, defensive:1, blowout:0 };

  function applyTimelineCat(g, scoreCat) {
    if (!g.timelineCat) return scoreCat;
    const timelineCat = TIMELINE_CAT_MAP[g.timelineCat];
    if (!timelineCat) return scoreCat;
    return timelineCat;
  }

  function processSportData(data, sport) {
    try {
    const apiKey = API_KEY[sport];

    // Helper: build cat object from confidence.cls (backend-derived from score)
    // Falls back to frontend categorize functions if no confidence data
    function buildCat(g) {
      if (g.confidence?.cls) {
        // Backend already computed the category from score — always trust it
        const baseCat = makeCat(g.confidence.cls);
        return baseCat;
      }
      // Fallback: compute from frontend rules (should rarely happen)
      if (sport === 'cricket') return applyTimelineCat(g, categorizeCricket(g.resultMargin, g.resultType, g.maxInnings));
      if (sport === 'tennis')  return categorizeTennis(g.homeSets, g.awaySets, g.sets || []);
      if (SPORTS[sport]?.cat) return applyTimelineCat(g, SPORTS[sport].cat(g.h, g.a));
      return makeCat('watchable');
    }

    if (sport === 'cricket') {
      const raw = data.cricket || { recent:[], upcoming:[] };
      allData.cricket = {
        recent:   (raw.recent||[]).map(g => ({ ...g, cat: buildCat(g) })),
        upcoming: raw.upcoming || [],
      };
      const el = document.getElementById('cricket-count');
      if (el) el.textContent = allData.cricket.recent.length;
      buildFilters('cricket');
      renderCricket();
    } else if (sport === 'tennis') {
      const raw = data.tennis || { recent:[], upcoming:[] };
      allData.tennis = {
        recent:   (raw.recent||[]).map(g => ({ ...g, cat: buildCat(g) })),
        upcoming: raw.upcoming || [],
      };
      const el = document.getElementById('tennis-count');
      if (el) el.textContent = allData.tennis.recent.length;
      buildFilters('tennis');
      renderTennis();
    } else if (sport === 'darts') {
      const raw = data.darts || { recent:[], upcoming:[] };
      allData.darts = {
        recent:   (raw.recent||[]).map(g => ({ ...g, cat: buildCat(g) })),
        upcoming: raw.upcoming || [],
      };
      const el = document.getElementById('darts-count');
      // Tab badge counts SESSIONS (or nights for single-session tournaments).
      // Visible UI shows session-summary cards, so the count matches.
      if (el) {
        const sessions = new Set(allData.darts.recent.map(g =>
          `${g.league}::${g.debug?.session || g.date}`
        ));
        el.textContent = sessions.size;
      }
      buildFilters('darts');
      renderDarts();
    } else {
      allData[sport] = {
        recent:   (data[apiKey]?.recent || []).map(g => ({ ...g, cat: buildCat(g) })),
        upcoming: data[apiKey]?.upcoming || [],
      };
      const el = document.getElementById(`${sport}-count`);
      if (el) el.textContent = allData[sport].recent.length;
      buildFilters(sport);
      renderGames(sport);
    }
    } catch(err) {
      console.error(`processSportData failed for ${sport}:`, err);
    }
  }

  async function loadScores() {
    try {
      buildSportTabs();

      // Single fetch — blob cache makes this near-instant
      const res = await fetch(`/.netlify/functions/get-scores?sport=all`);
      if (!res.ok) throw new Error('Bad response');
      const data = await res.json();

      // Use server's fetch timestamp if available (from blob cache)
      const serverFetchedAt = res.headers.get('X-Fetched-At');
      loadedAt = serverFetchedAt ? new Date(serverFetchedAt).getTime() : Date.now();

      // Process all sports at once
      ALL_SPORTS.forEach(s => { if (s.key !== 'all') processSportData(data, s.key); });

      // Now that allData is populated, rebuild tabs so out-of-season sports
      // (zero recent + zero upcoming) sink to the end of their group.
      // Rebuilding replaces the tab DOM (counts reset to "—"), so re-populate
      // counts immediately after — same pattern toggleSport() already uses.
      buildSportTabs();
      ALL_SPORTS.forEach(s => {
        const el = document.getElementById(`${s.key}-count`);
        if (el && allData[s.key]) el.textContent = allData[s.key].recent.length;
      });

      renderTopPicks();
      // Pinned "All Sports" tab has no inline game list underneath it —
      // hide the ALL GAMES header if that's the sport a returning visitor
      // last had active (saved in localStorage).
      const allGamesHeader = document.getElementById('all-games-header');
      if (allGamesHeader) allGamesHeader.style.display = (activeSport === 'all') ? 'none' : '';
      // currentTopPickIds is now populated; re-render the active sport's
      // inline games so Top Pick badges appear on matching cards. The
      // initial render inside processSportData happens BEFORE renderTopPicks,
      // so badges would be missing without this second pass.
      if (activeSport === 'cricket')      renderCricket();
      else if (activeSport === 'tennis')  renderTennis();
      else if (activeSport === 'darts')   renderDarts();
      else if (activeSport === 'all')     { /* no inline panel for the merged view */ }
      else if (activeSport)               renderGames(activeSport);

      document.getElementById('loading').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      updateLastUpdatedText();
      setInterval(updateLastUpdatedText, 60000);

    } catch(err) {
      console.error(err);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-box').style.display = 'block';
    }
  }

  function loadSubscriptions() {
    try { return JSON.parse(localStorage.getItem('watchSubscriptions') || 'null') || {}; }
    catch { return {}; }
  }

  function saveSubscriptions(subs) {
    localStorage.setItem('watchSubscriptions', JSON.stringify(subs));
  }

  function hasSubscriptions() {
    return Object.values(loadSubscriptions()).some(Boolean);
  }

  function getWatchStatus(game) {
    const subs = loadSubscriptions();
    if (!hasSubscriptions()) return { status: 'unknown' };

    const geo = Array.isArray(game.geoBroadcasts) ? game.geoBroadcasts : [];
    const broadcastStr = game.broadcast || '';

    // Build ordered list of national networks
    const networks = [];
    const national = geo.filter(b => b?.market?.type === 'National');
    for (const b of national) {
      const name = b?.media?.shortName;
      if (name && !networks.includes(name)) networks.push(name);
    }
    // Also parse broadcast string (e.g. "NBC/Peacock") for any not in geo
    for (const n of broadcastStr.split('/').map(s => s.trim()).filter(Boolean)) {
      if (!networks.includes(n)) networks.push(n);
    }
    if (networks.length === 0) networks.push('WNBA League Pass');

    // Find all networks the user can watch, return the most relevant display name
    const canWatchOn = [];
    for (const network of networks) {
      const needed = NETWORK_SUBS[network];
      if (!needed) continue;
      if (needed.includes('free') || needed.some(s => subs[s])) {
        canWatchOn.push(network);
      }
    }
    if (canWatchOn.length > 0) {
      // Filter out 'WNBA League Pass' if other options exist
      const display = canWatchOn.filter(n => n !== 'WNBA League Pass');
      const network = (display.length > 0 ? display : canWatchOn).join(' / ');
      return { status: 'can-watch', network, subNeeded: null };
    }

    // Can't watch any — suggest cheapest streaming upgrade (prefer non-cable)
    for (const network of networks) {
      const needed = (NETWORK_SUBS[network] || []).filter(s => s !== 'free' && s !== 'cable');
      if (needed.length > 0) return { status: 'upgrade', network: networks[0], subNeeded: needed[0] };
    }
    return { status: 'upgrade', network: networks[0], subNeeded: 'cable' };
  }

  function buildWatchStatusHTML(game) {
    const ws = getWatchStatus(game);
    if (ws.status === 'unknown') return '';
    if (ws.status === 'can-watch') {
      return `<div class="watch-status can-watch">✅ You can watch this${ws.network ? ` — ${ws.network}` : ''}</div>`;
    }
    const subOpt = SUBSCRIPTION_OPTIONS.find(o => o.id === ws.subNeeded);
    const url = ws.subNeeded ? SUBSCRIPTION_URLS[ws.subNeeded] : null;
    const subLabel = subOpt ? subOpt.label : (ws.subNeeded || 'subscription');
    const upgradeLink = url
      ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${subLabel}</a>`
      : subLabel;
    return `<div class="watch-status upgrade">⚠️ ${ws.network || 'This game'} — not in your lineup (${upgradeLink})</div>`;
  }

  function getReplayNetwork(game) {
    const broadcastStr = game.broadcast || '';
    if (broadcastStr) return broadcastStr;
    const geo = Array.isArray(game.geoBroadcasts) ? game.geoBroadcasts : [];
    const national = geo.filter(b => b?.market?.type === 'National');
    return national[0]?.media?.shortName || null;
  }

  // All WNBA games end up on League Pass (nationally televised = next day 6AM ET,
  // local/out-of-market = shortly after final buzzer). Must Watch only.
  function buildReplayStatusHTML(game) {
    if (game.league !== 'WNBA') return '';
    if (game.cat?.cls !== 'watchworthy' && game.cat?.cls !== 'scorefest') return '';

  // Priority order for picks: scorefest > watchworthy > watchable
  const CAT_RANK = { scorefest:3, watchworthy:2, watchable:1, defensive:0, blowout:0 };

  // Sort games by confidence score (primary) then category rank as fallback
  function sortByExcitement(games) {
    return [...games].sort((a, b) => {
      // Category tier first — Must Watch before Watchable before Skip
      const rankDiff = (CAT_RANK[b.cat?.cls] ?? 0) - (CAT_RANK[a.cat?.cls] ?? 0);
      if (rankDiff !== 0) return rankDiff;

      // Within same tier: confidence score is the authority
      const aScore = a.confidence?.score ?? 0;
      const bScore = b.confidence?.score ?? 0;
      if (bScore !== aScore) return bScore - aScore;

      // Final tiebreaker: most recent
      return b.ts - a.ts;
    });
  }

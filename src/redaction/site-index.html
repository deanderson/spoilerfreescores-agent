  // For dynamic labels like "5 goals", "8 pts", "3 pt margin" — match patterns.
  // Sport context matters here: a "5 pt margin" is close in basketball but wide
  // in football (NFL). A "171 pt" total is high in WNBA but low in NBA. So this
  // function takes the sport to apply proportional thresholds where relevant.
  function formatDynamicLabel(label, sport) {
    // ── Score totals ─────────────────────────────────────────────────────
    let m = label.match(/^(\d+)\s+(goals|pts|runs)$/);
    if (m) {
      const num = parseInt(m[1], 10);
      const unit = m[2];

      if (unit === 'goals') {
        // Soccer: 5+ goals is high, 7+ is wild. NHL: 6+ is high, 8+ is wild.
        if (sport === 'nhl' || sport === 'hockey') {
          if (num >= 8) return 'Goals galore';
          if (num >= 6) return 'High-scoring game';
          return null;
        }
        // Soccer
        if (num >= 7) return 'Goals galore';
        if (num >= 5) return 'High-scoring game';
        return null;
      }

      if (unit === 'pts') {
        if (sport === 'wnba') {
          if (num >= 190) return 'They could not stop scoring';
          if (num >= 175) return 'Plenty of offense';
          return null;
        }
        if (sport === 'nba') {
          if (num >= 240) return 'They could not stop scoring';
          if (num >= 220) return 'Plenty of offense';
          return null;
        }
        if (sport === 'nfl') {
          if (num >= 60) return 'They could not stop scoring';
          if (num >= 50) return 'High-scoring game';
          return null;
        }
        if (sport === 'ncaaf') {
          if (num >= 80) return 'They could not stop scoring';
          if (num >= 65) return 'High-scoring game';
          return null;
        }
        return num >= 50 ? 'High-scoring game' : null;
      }

      if (unit === 'runs') {
        if (num >= 18) return 'Lots of runs scored';
        if (num >= 12) return 'Plenty of offense';
        return null;
      }
    }

    // ── Margins ──────────────────────────────────────────────────────────
    m = label.match(/^(\d+)\s+(goal|pt|run)\s+margin$/);
    if (m) {
      const n = parseInt(m[1], 10);
      const unit = m[2];

      if (unit === 'goal') {
        // Both soccer and NHL — 1 is close, 2 is competitive
        if (n === 1) return 'Down to the wire';
        if (n === 2) return 'Competitive finish';
        return null;
      }

      if (unit === 'run') {
        if (n === 1) return 'Down to the wire';
        if (n === 2) return 'Competitive finish';
        return null;
      }

      if (unit === 'pt') {
        if (sport === 'nba' || sport === 'wnba') {
          if (n <= 3)  return 'Down to the wire';
          if (n <= 5)  return 'Close finish';
          if (n <= 10) return 'Came down to the closing minutes';
          return null;
        }
        if (sport === 'nfl') {
          if (n <= 3) return 'Down to the wire';
          if (n <= 7) return 'Came down to the closing minutes';
          return null;
        }
        if (sport === 'ncaaf') {
          if (n <= 3) return 'Down to the wire';
          if (n <= 7) return 'Came down to the closing minutes';
          if (n <= 14) return 'Stayed within reach';
          return null;
        }
        if (n <= 7) return 'Close finish';
        return null;
      }
    }

    // ── Cricket result ───────────────────────────────────────────────────
    m = label.match(/^Won by (\d+) (wkts|runs)$/);
    if (m) {
      const n = parseInt(m[1], 10);
      const unit = m[2];
      if (unit === 'wkts') {
        if (n <= 2) return 'Down to the wire';
        if (n <= 4) return 'Close finish';
        return 'Comfortable margin';
      }
      if (unit === 'runs') {
        if (n <= 10) return 'Down to the wire';
        if (n <= 20) return 'Close finish';
        return 'Comfortable margin';
      }
      return null;
    }

    // ── Lead changes ─────────────────────────────────────────────────────
    m = label.match(/^(\d+) lead changes$/);
    if (m) {
      const n = parseInt(m[1], 10);
      if (n >= 15) return 'Wildly competitive';
      if (n >= 8)  return 'Back and forth all game';
      if (n >= 5)  return 'Multiple lead changes';
      return null;
    }

    // ── Cricket innings total ────────────────────────────────────────────
    m = label.match(/^(\d+) run innings$/);
    if (m) return 'A big innings total';

    // ── MLB extra innings ────────────────────────────────────────────────
    m = label.match(/^Extra innings \((\d+)\)$/);
    if (m) {
      const innings = parseInt(m[1], 10);
      if (innings >= 13) return '🏆 Marathon extra innings';
      if (innings >= 12) return 'Marathon extra innings';
      return 'Went to extra innings';
    }
    m = label.match(/^Marathon extra innings \((\d+)\)$/);
    if (m) return '🏆 Marathon extra innings';

    // ── Red cards ────────────────────────────────────────────────────────
    m = label.match(/^(\d+) red cards$/);
    if (m) return parseInt(m[1], 10) >= 3 ? 'Multiple players sent off' : 'Two players sent off';

    // ── Tie scores ───────────────────────────────────────────────────────
    if (label === 'Tie' || label === 'Tied/OT') return 'Down to the wire';
    if (label === 'Draw') {
      // Draws in soccer can be exciting (high-scoring) or boring (low). The
      // overall context will already signal that via goals total.
      return null;
    }

    // ── Ranked matchup (NCAAF, softball) ───────────────────────────────────
    // Rank itself is already shown directly on the card via the team-name
    // prefix — this just adds it to the insight reveal too for consistency.
    if (/^#\d+ vs #\d+$/.test(label)) return 'A ranked matchup';
    if (/^#\d+ ranked$/.test(label))  return 'One team is ranked';

    return null;
  }

  function getInsightPhrases(factors, sport) {
    if (!Array.isArray(factors) || factors.length === 0) return [];

    // Sort factors by absolute point contribution (most impactful first)
    const ranked = [...factors].sort((a, b) =>
      Math.abs(b.points || 0) - Math.abs(a.points || 0)
    );

    // Check if game had meaningful lead changes — if not, margin phrases
    // like "Down to the wire" are misleading (one team may have led wire-to-wire)
    const lcFactor = factors.find(f => f.label?.match(/^(\d+) lead changes$/));
    const leadChanges = lcFactor ? parseInt(lcFactor.label, 10) : 0;
    const hasComeback = factors.some(f => f.label?.includes('Close game after'));
    // A comeback proves it wasn't wire-to-wire even with few recorded lead changes
    const hasRealBackAndForth = leadChanges >= 3 || hasComeback;

    const phrases = [];
    const seen = new Set();
    for (const f of ranked) {
      let phrase = null;
      if (Object.prototype.hasOwnProperty.call(INSIGHT_MAP, f.label)) {
        phrase = INSIGHT_MAP[f.label];   // may be null = suppress
      } else {
        phrase = formatDynamicLabel(f.label, sport);
      }
      // Suppress "close finish" / "down to the wire" phrases when there were
      // no real lead changes — a team that led wire-to-wire and won by 3
      // isn't a nail-biter even if the margin looks close.
      // Only apply to WNBA/NBA where we have reliable lead change data.
      if (phrase && (phrase === 'Down to the wire' || phrase === 'Close finish' || phrase === 'Competitive finish')
          && (sport === 'wnba' || sport === 'nba') && !hasRealBackAndForth) {
        phrase = null;
      }
      if (!phrase) continue;
      if (seen.has(phrase)) continue;     // dedupe (e.g. multiple "High-scoring")
      seen.add(phrase);
      phrases.push(phrase);
      if (phrases.length >= 3) break;
    }

    return phrases;
  }

  // Render the inner HTML of the .insight-reveal div for a game. Includes
  // the phrase tags and a "Show Score →" button at the end. The score button
  // lives INSIDE the insights area so that revealing the score requires
  // first opening insights — a deliberate two-step that aligns with the
  // site's spoiler-free promise (no accidental score reveals).
  //
  // scoreBtnArgs is the JS-literal string used inside the toggleScore call,
  // e.g. "5,3" for sports with numeric h/a, or "'set scores','' " for cricket/
  // tennis. Caller pre-builds it so this helper stays sport-agnostic.
  function buildInsightHTML(factors, sport, scoreBtnArgs, espnHeadline) {
    const phrases = getInsightPhrases(factors, sport);
    // Historic headline goes first, styled differently
    const historicHTML = espnHeadline
      ? `<span class="insight-tag insight-tag--historic">${espnHeadline}</span>`
      : '';
    const tagsHTML = phrases.length
      ? phrases.map(p => `<span class="insight-tag">${p}</span>`).join('')
      : (espnHeadline ? '' : '<span class="insight-tag insight-tag--empty">Nothing notable.</span>');
    const scoreBtn = scoreBtnArgs
      ? `<button class="insight-score-btn" onclick="toggleScore(this,${scoreBtnArgs})">Show Score →</button>`
      : '';
    return historicHTML + tagsHTML + scoreBtn;
  }

  // Broadcast info for upcoming games. Returns null when nothing useful to
  // show; otherwise an object {icon, text, sublabel} for the card to render.
  // Strategy: prioritize National TV > National streaming > Local-only fallback.
  // For local-only games (most WNBA games on any given day), point users at
  // WNBA League Pass since their local market is unknown.
  //
  // Streaming services that are subscription-required get a "(subscription)"
  // sublabel; ad-supported / cable channels don't. This is a heuristic, not
  // exhaustive — adding services as we encounter them.
  const SUBSCRIPTION_STREAMERS = new Set([
    'Peacock', 'ESPN+', 'Disney+', 'Amazon Prime', 'Prime Video',
    'Paramount+', 'Max', 'Apple TV+', 'NBA TV',
  ]);

  function getBroadcastInfo(game) {
    if (!game) return null;
    const geo = Array.isArray(game.geoBroadcasts) ? game.geoBroadcasts : [];

    // No data at all → "TBD" state
    if (geo.length === 0 && !game.broadcast) {
      return { icon: '📺', text: 'Broadcast TBD', sublabel: '' };
    }

    // Find a National broadcast (TV preferred over Streaming)
    const national    = geo.filter(b => b?.market?.type === 'National');
    const nationalTV  = national.find(b => b?.type?.shortName === 'TV');
    const nationalStr = national.find(b => b?.type?.shortName === 'Streaming');

    if (nationalTV) {
      const net = nationalTV.media?.shortName || 'national TV';
      return { icon: '📺', text: net, sublabel: '' };
    }
    if (nationalStr) {
      const net = nationalStr.media?.shortName || 'streaming';
      const isPaid = SUBSCRIPTION_STREAMERS.has(net);
      return { icon: '💻', text: net, sublabel: isPaid ? 'subscription' : '' };
    }

    // No national broadcast — local-only game. WNBA League Pass is the
    // out-of-market answer.
    return {
      icon: '📍',
      text: 'Local broadcast only',
      sublabel: 'WNBA League Pass for out-of-market',
    };
  }

  function buildBroadcastHTML(game) {
    const info = getBroadcastInfo(game);
    if (!info) return '';
    const sub = info.sublabel ? ` <span class="broadcast-sub">(${info.sublabel})</span>` : '';
    return `<div class="broadcast-info">${info.icon} ${info.text}${sub}</div>`;
  }

  // Should we suppress the "Watch on [provider]" button for this game?
  //
  // The watch provider (WNBA League Pass, etc.) is the canonical replay
  // home for *most* games in a sport — but for nationally televised games
  // it can be misleading. WNBA League Pass specifically does NOT carry
  // games that aired on a national network (NBC, ESPN, ION, etc.); those
  // replays live on the network's own platform.
  //
  // For WNBA games, `game.broadcast` is a string ESPN populates only for
  // national broadcasts (e.g., "NBC/Peacock"). If it's set, the League
  // Pass button would point users to a service that doesn't have the
  // game. Suppress it; the broadcast-info line tells them where to go.
  function shouldHideWatchProvider(game) {
    if (!game) return false;
    if (game.league === 'WNBA' && game.broadcast) return true;
    return false;
  }

  // Format a millisecond timestamp as "8:00 PM EDT" style in the USER's
  // local timezone. Critical: backend formatting runs on Netlify which
  // defaults to UTC, producing useless "11:00 PM UTC" strings. Frontend
  // formatting picks up the browser's actual timezone automatically when
  // we don't pass a `timeZone` option to toLocaleTimeString.
  function formatGameTime(ts) {
    if (!ts) return '';
    try {
      const d = new Date(ts);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleTimeString(undefined, {
        hour: 'numeric',
        minute: '2-digit',
        timeZoneName: 'short',
      });
    } catch {
      return '';
    }
  }


  // Top Picks window state — tracked per-sport so switching tabs keeps each
  // sport's chosen window. Darts uses different options ('recent', 'all')
  // because tournament/Premier-League cadence doesn't map to today/this-week.
  const TP_WINDOW_OPTIONS = {
    darts: [
      { key: 'recent', label: 'Recent',  ms: 3 * 86400000 },
      { key: 'all',    label: 'All',     ms: 14 * 86400000 },
    ],
    default: [
      { key: 'today',  label: 'Today',     ms: 1 * 86400000 },
      { key: 'recent', label: 'Recent',    ms: 7 * 86400000 },
      { key: 'week',   label: 'This Week', ms: 10 * 86400000 },
    ],
  };

  function tpOptionsFor(sport) {
    return TP_WINDOW_OPTIONS[sport] || TP_WINDOW_OPTIONS.default;
  }

  // Per-sport selected window. Default for normal sports = 'recent' because
  // Top Picks gets a richer view across the past week than from one day —
  // and a first-time visitor seeing populated picks is a better intro than
  // "No standout games today." Darts uses its first option since darts only
  // has 'recent' and 'all'.
  const tpWindowBySport = {};
  function getTpWindow() {
    const opts = tpOptionsFor(activeSport);
    if (!tpWindowBySport[activeSport]) {
      const defaultKey = opts.find(o => o.key === 'recent')?.key || opts[0].key;
      tpWindowBySport[activeSport] = defaultKey;
    }
    return tpWindowBySport[activeSport];
  }
  function tpWindowMs() {
    const opts = tpOptionsFor(activeSport);
    const w = getTpWindow();
    return (opts.find(o => o.key === w) || opts[0]).ms;
  }

  // Backwards-compat alias — code below still reads `tpWindow` as if it were a
  // simple string. Routed through the per-sport getter so existing logic
  // (which compares to 'today' / 'recent' / 'week' / 'all') keeps working.
  let tpWindow;

  function renderTpTabs() {
    const container = document.getElementById('tp-tabs');
    if (!container) return;
    const opts = tpOptionsFor(activeSport);
    const current = getTpWindow();
    container.innerHTML = opts.map(o =>
      `<button class="tp-tab${o.key === current ? ' active' : ''}" data-window="${o.key}" onclick="setTpWindow('${o.key}')">${o.label}</button>`
    ).join('');
  }

  function setTpWindow(w) {
    tpWindowBySport[activeSport] = w;
    tpWindow = w;
    renderTpTabs();
    renderTopPicks();
    // Re-render the inline games so Top Pick badges reflect the new window.
    // Sport-specific dispatcher used because different sports use different
    // render entry points (renderCricket, renderTennis, renderDarts, renderGames).
    if (activeSport === 'cricket')      renderCricket();
    else if (activeSport === 'tennis')  renderTennis();
    else if (activeSport === 'darts')   renderDarts();
    else                                 renderGames(activeSport);
  }

  // Cross-sport Must Watch feed for the pinned "All Sports" tab. Strictly
  // Must Watch tier only (scorefest/watchworthy, same SCORE_FLOOR as every
  // other sport's Top Picks) — no Watchable backfill, since the point of
  // this view is "what's actually worth your time across everything,"
  // not "keep the grid populated." Caps at 2 picks per sport so a
  // high-volume sport (MLB, CS2) can't crowd out a low-volume one (WNBA,
  // Tennis) that only plays a couple of games a day.
  const ALL_SPORTS_PER_SPORT_CAP = 2;
  const ALL_SPORTS_FEED_MAX = 8;
  function getAllSportsPicks(cutoff, SCORE_FLOOR) {
    const candidates = [];

    ALL_SPORTS.forEach(s => {
      if (s.key === 'all') return;

      // Darts is session-level, not match-level — mirrors the dedicated
      // darts Top Picks logic (grouping by night/session) rather than
      // treating individual matches as picks, for the same spoiler-safety
      // reason: naming who won a bracket match reveals who's still in it.
      if (s.key === 'darts') {
        const games = (allData.darts?.recent || []).filter(g => g.ts >= cutoff);
        const byNight = {};
        games.forEach(g => {
          const sessionKey = g.debug?.session || g.date;
          const key = `${g.league}::${sessionKey}`;
          if (!byNight[key]) byNight[key] = { league: g.league, date: sessionKey, ts: g.ts, games: [] };
          byNight[key].games.push(g);
          if (g.ts > byNight[key].ts) byNight[key].ts = g.ts;
        });
        Object.values(byNight)
          .map(n => ({ ...n, summary: summarizeNight(n.games) }))
          .filter(n => n.summary.cls === 'watchworthy') // Must Watch tier only, no Watchable backfill
          .sort((a, b) => b.ts - a.ts)
          .slice(0, ALL_SPORTS_PER_SPORT_CAP)
          .forEach(n => candidates.push({
            sport: 'darts',
            mergedLabel: s.label,
            isDartsNight: true,
            league: n.league,
            date: n.date,
            ts: n.ts,
            cat: { cls: n.summary.cls, icon: n.summary.icon, label: n.summary.label },
            summary: n.summary,
            watch: n.summary.watch,
            isFallback: false,
            _rank: 72, // synthetic — darts nights have no numeric confidence score to compare against other sports
          }));
        return;
      }

      const games = allData[s.key]?.recent || [];
      games
        .filter(g => g.ts >= cutoff)
        .filter(g =>
          (g.confidence?.score ?? 0) >= SCORE_FLOOR &&
          (g.cat?.cls === 'scorefest' || g.cat?.cls === 'watchworthy')
        )
        .sort((a, b) => (b.confidence?.score ?? 0) - (a.confidence?.score ?? 0))
        .slice(0, ALL_SPORTS_PER_SPORT_CAP)
        .forEach(g => candidates.push({
          ...g,
          sport: s.key,
          mergedLabel: s.label,
          isFallback: false,
          _rank: g.confidence?.score ?? 0,
        }));
    });

    candidates.sort((a, b) => b._rank - a._rank);
    return candidates.slice(0, ALL_SPORTS_FEED_MAX);
  }

  function getTopPicksGames() {
    const now = Date.now();
    const DAY  = 86400000;
    const cutoff = now - tpWindowMs();
    tpWindow = getTpWindow(); // sync the legacy string for downstream comparisons
    const SCORE_FLOOR = 45; // minimum score to appear in Top Picks

    // Pinned "All Sports" tab: cross-sport Must Watch feed, not a single
    // sport's game list. Handled entirely separately since every other
    // branch below assumes a single activeSport's data shape.
    if (activeSport === 'all') return getAllSportsPicks(cutoff, SCORE_FLOOR);

    const games = allData[activeSport]?.recent || [];

    // Darts is structurally different: a "pick" is a session/night, not an
    // individual match. Showing "Littler vs Humphries" as Top Pick reveals
    // who made the final, busting the spoiler-free promise. So for darts we
    // group by (league, session) — falling back to date for single-session
    // tournaments like Premier League — and return session-level summaries.
    if (activeSport === 'darts') {
      const inWindow = games.filter(g => g.ts >= cutoff);
      const byNight = {};
      inWindow.forEach(g => {
        const sessionKey = g.debug?.session || g.date;
        const key = `${g.league}::${sessionKey}`;
        if (!byNight[key]) byNight[key] = { league: g.league, date: sessionKey, ts: g.ts, games: [] };
        byNight[key].games.push(g);
        if (g.ts > byNight[key].ts) byNight[key].ts = g.ts;
      });

      // Score each night by its summary. Must Watch nights win, then Watchable.
      // Within a tier, more recent nights first.
      const tierRank = { watchworthy: 3, watchable: 2, blowout: 1 };
      const ranked = Object.values(byNight)
        .map(n => ({ ...n, summary: summarizeNight(n.games) }))
        .filter(n => tpWindow !== 'today' || n.summary.cls !== 'blowout')
        .sort((a, b) => {
          const tierDiff = (tierRank[b.summary.cls] || 0) - (tierRank[a.summary.cls] || 0);
          if (tierDiff !== 0) return tierDiff;
          return b.ts - a.ts;
        });

      // Recent window = 3 picks max; All window = up to 5 since it covers more ground.
      const maxNights = tpWindow === 'all' ? 5 : 3;
      // Don't show "Skip" nights as Top Picks, ever — it'd be the opposite
      // of a recommendation. Filter to Must Watch + Watchable.
      const recommended = ranked.filter(n => n.summary.cls !== 'blowout').slice(0, maxNights);

      // Wrap each as a "pick" object with a darts-specific shape that
      // renderTopPicks can recognize and render differently.
      return recommended.map(n => ({
        sport: 'darts',
        isDartsNight: true,
        league: n.league,
        date: n.date,
        ts: n.ts,
        cat: { cls: n.summary.cls, icon: n.summary.icon, label: n.summary.label },
        summary: n.summary,
        watch: n.summary.watch,
        isFallback: n.summary.cls === 'watchable',
      }));
    }

    function sortCandidates(list) {
      return list.sort((a, b) => {
        if (activeSport === 'football' && typeof FOOTBALL_TIER1 !== 'undefined') {
          const aTier1 = FOOTBALL_TIER1.has(a.league) ? 1 : 0;
          const bTier1 = FOOTBALL_TIER1.has(b.league) ? 1 : 0;
          if (bTier1 !== aTier1) return bTier1 - aTier1;
        }
        const aScore = a.confidence?.score ?? 0;
        const bScore = b.confidence?.score ?? 0;
        if (bScore !== aScore) return bScore - aScore;
        return b.ts - a.ts;
      });
    }

    function pickFrom(candidates, max) {
      const seenLeagues = new Set();
      const picks = [];
      // Only dedup by league when there's actual variety. For single-league
      // sports (NBA, MLB, NHL, NFL, IPL-only cricket, Premier League Darts)
      // every game shares one league name and dedup would cap the result at 1.
      const leagueCount = new Set(candidates.map(g => g.league)).size;
      const dedupByLeague = leagueCount > 1;

      // FOOTBALL_TIER1 is only relevant when football is active. Guard the
      // reference so this function works for every sport.
      if (activeSport === 'football' && typeof FOOTBALL_TIER1 !== 'undefined') {
        const tier1Games = candidates.filter(g => FOOTBALL_TIER1.has(g.league));
        for (const g of tier1Games) {
          if (picks.length >= 2) break;
          if (dedupByLeague && seenLeagues.has(g.league)) continue;
          seenLeagues.add(g.league);
          picks.push(g);
        }
      }
      for (const g of candidates) {
        if (picks.length >= max) break;
        if (dedupByLeague && seenLeagues.has(g.league)) continue;
        if (picks.includes(g)) continue;   // tier1 might have already picked it
        seenLeagues.add(g.league);
        picks.push(g);
      }
      return picks;
    }

    const maxPicks = tpWindow === 'week' ? 5 : 3;
    // Minimum picks per window. Today stays pure Must Watch — empty Today is
    // the message ("nothing electric is happening, broaden your window").
    // Recent and Week backfill from Watchable so they always feel populated.
    const minPicks = tpWindow === 'week' ? 3 : tpWindow === 'recent' ? 2 : 0;

    // Two eligibility pools with different floors:
    // - Must Watch needs to clear SCORE_FLOOR (high-quality recommendation)
    // - Watchable just needs to be in the time window — its `watchable` class
    //   was already a deliberate categorization in the scoring engine, so
    //   double-flooring it here would prevent backfill from ever working.
    const inWindow   = games.filter(g => g.ts >= cutoff);
    const mustWatch  = sortCandidates(inWindow.filter(g =>
      (g.confidence?.score ?? 0) >= SCORE_FLOOR &&
      (g.cat?.cls === 'scorefest' || g.cat?.cls === 'watchworthy')
    ));
    const watchable  = sortCandidates(inWindow.filter(g => g.cat?.cls === 'watchable'));

    const mustWatchPicks = pickFrom(mustWatch, maxPicks);

    // Have Must Watch — show what we have, optionally backfill with Watchable
    // up to the window minimum so the bar feels populated (Recent/Week only).
    if (mustWatchPicks.length > 0) {
      const picks = mustWatchPicks.map(g => ({ ...g, sport: activeSport, isFallback: false }));
      if (picks.length < minPicks) {
        const seenIds = new Set(picks.map(g => g.id));
        const fillNeeded = minPicks - picks.length;
        const fill = pickFrom(watchable.filter(g => !seenIds.has(g.id)), fillNeeded)
          .map(g => ({ ...g, sport: activeSport, isFallback: true }));
        picks.push(...fill);
      }
      return picks;
    }

    // No Must Watch. For Today, return empty — the empty state is the signal.
    // For Recent/Week, show the minimum from Watchable so the user has options.
    if (minPicks === 0) return [];
    return pickFrom(watchable, minPicks).map(g => ({ ...g, sport: activeSport, isFallback: true }));
  }

  function tpScoreStr(g) {
    if (g.sport === 'cricket') return g.status || '';
    if (g.sport === 'tennis') {
      const sets = (g.sets||[]).map(s=>`${s.h}-${s.a}`).join(' ');
      return `${g.homeSets}–${g.awaySets}${sets ? ' ('+sets+')' : ''}`;
    }
    return `${g.h} – ${g.a}`;
  }

  // Set of game IDs currently shown in the Top Picks section. Used by the
  // inline All Games render to badge games with "⭐ Top Pick" when they
  // also appear in the curated Top Picks above. Recomputed every time
  // renderTopPicks runs (e.g. when the user switches Today/Recent/This Week).
  let currentTopPickIds = new Set();

  // Empty-state lines cycled by day-of-year. Period of 8 doesn't share a
  // factor with 7, so the same user doesn't see the same line every
  // Wednesday. Lines vary in tone — some blunt, some patient, some
  // reassuring — so the site feels like it has a person behind it even
  // on weeks when nothing's worth watching.
  const EMPTY_PICKS_LINES = [
    "Nothing must-watch this week. Even we get quiet stretches.",
    "Slow week. Nothing's begging to be watched.",
    "No must-watch games this week — sometimes that's how it goes.",
    "Quiet week in this sport. Check back.",
    "Nothing standout right now. The good ones will be back.",
    "This week's a wash. No drama to report.",
    "No must-watch games found. Save your evening for something else.",
    "Quiet stretch. Nothing demanding your time.",
  ];
  function getEmptyPicksLine() {
    const start = new Date(new Date().getFullYear(), 0, 0);
    const diff = Date.now() - start.getTime();
    const dayOfYear = Math.floor(diff / 86400000);
    return EMPTY_PICKS_LINES[dayOfYear % EMPTY_PICKS_LINES.length];
  }

  // Editorial line for the Top Picks section. Returns a string or null.
  // Null = no line; let the picks speak for themselves. We only show a line
  // when there's actually something notable to say:
  //   - Today view with picks (context-specific framing)
  //   - Any window with 4+ Must Watch (loaded)
  //   - Any window with all-fallback picks (slim pickings)
  //   - Any window with mix (Must Watch + backfill)
  // For an ordinary 2-3 Must Watch in a wider window, no line — that's
  // mundane, no kicker needed.
  //
  // Variants per state are cycled by day-of-year so the same data state
  // produces different copy day to day. Period of 5 (variants per state)
  // works fine since users rarely see the same state two days in a row.
  function getEditorialLine(picks, window, sport) {
    if (sport === 'darts') return null;  // sessions have different vocabulary; skip for now
    if (!picks || picks.length === 0) return null;

    const real = picks.filter(p => !p.isFallback).length;
    const fb = picks.filter(p => p.isFallback).length;
    const total = picks.length;

    // Day-based variant picker (consistent within a day, varies day-to-day).
    const start = new Date(new Date().getFullYear(), 0, 0);
    const dayOfYear = Math.floor((Date.now() - start.getTime()) / 86400000);
    const pick = (arr) => arr[dayOfYear % arr.length];

    const windowWord = window === 'today' ? 'tonight'
                     : window === 'recent' ? 'this week'
                     : 'this week';

    // STATE 1: All real picks, count = 1 (only meaningful for "today")
    if (real === 1 && fb === 0 && window === 'today') {
      return pick([
        "One worth making time for tonight.",
        "One standout pick tonight.",
        "One game to watch tonight.",
        "Just one tonight — worth it.",
        "Tonight's only must-watch.",
      ]);
    }

    // STATE 2: All real, count 2-3 — only show kicker on Today
    if (real >= 2 && real <= 3 && fb === 0 && window === 'today') {
      return pick([
        `${real} Must Watch games tonight.`,
        `${real} worth watching tonight.`,
        `${real} games to catch tonight.`,
        `${real} solid picks tonight.`,
        `${real} games tonight — pick your night.`,
      ]);
    }

    // STATE 3: 4+ Must Watch — always worth a "loaded" kicker
    if (real >= 4) {
      return pick([
        `Loaded ${windowWord} — ${real} Must Watch games.`,
        `Big ${windowWord}. ${real} games worth watching.`,
        `${real} Must Watch ${windowWord} — clear your schedule.`,
        `Stacked ${windowWord}. ${real} games to catch.`,
        `${real} standout games ${windowWord}.`,
      ]);
    }

    // STATE 4: Mix of Must Watch + backfill
    if (real > 0 && fb > 0) {
      return pick([
        `${real} Must Watch ${windowWord}, plus ${fb} worth a look.`,
        `${real} standout${real > 1 ? 's' : ''} ${windowWord} — ${fb} more if you want them.`,
        `${real} Must Watch, ${fb} Watchable ${windowWord}.`,
        `${real} top pick${real > 1 ? 's' : ''} ${windowWord} and ${fb} solid option${fb > 1 ? 's' : ''}.`,
      ]);
    }

    // STATE 5: All fallback (no Must Watch cleared the bar)
    if (real === 0 && fb > 0) {
      return pick([
        `No Must Watch ${windowWord} — here's the closest thing.`,
        `Slim pickings ${windowWord}. These are the best of the rest.`,
        `Nothing standout ${windowWord} — these are the closest.`,
        `Quiet ${windowWord}. Here's what's worth a look.`,
      ]);
    }

    // Otherwise (e.g. 2-3 Must Watch in a wider window): no kicker, let the
    // picks speak for themselves.
    return null;
  }

  function renderTopPicks() {
    const container = document.getElementById('top-picks-container');
    if (!container) return;

    renderTpTabs();
    const picks = getTopPicksGames();

    // The pinned tab's badge is "how many Must Watch picks are showing
    // right now" rather than a total game count (there's no single
    // "recent" list for a cross-sport feed) — it updates alongside the
    // Today/Recent/This Week toggle like the rest of this view does.
    if (activeSport === 'all') {
      const allCountEl = document.getElementById('all-count');
      if (allCountEl) allCountEl.textContent = picks.length;
    }

    // Update the set of pick IDs so inline renders can badge matching cards.
    // Darts uses session-level picks (no individual matchups), so skip those.
    currentTopPickIds = new Set(
      picks.filter(g => !g.isDartsNight).map(g => makeGameId(g))
    );
    // Suggestion engine: when this window is sparse, point to a wider one.
    // For non-darts the chain is today → recent → week. For darts: recent → all.
    let nextWindow, nextLabel;
    if (activeSport === 'darts') {
      if (tpWindow === 'recent') { nextWindow = 'all';    nextLabel = 'All'; }
      else                       { nextWindow = null;     nextLabel = ''; }
    } else {
      nextWindow = tpWindow === 'today' ? 'recent' : tpWindow === 'recent' ? 'week' : null;
      nextLabel  = tpWindow === 'today' ? 'Recent' : 'This Week';
    }
    const isNarrowWindow = (activeSport === 'darts')
      ? tpWindow === 'recent'
      : tpWindow === 'today';

    const onePickCopy = (() => {
      if (picks.length !== 1) return '';
      const isFallback = !!picks[0]?.isFallback;
      if (activeSport === 'darts') {
        return isFallback
          ? 'No must-watch sessions — this is the best available.'
          : 'That\'s the session worth watching.';
      }
      return isFallback
        ? 'No elite games — this is the best available.'
        : 'That\'s the one worth watching today.';
    })();

    const suggestionHTML = nextWindow
      ? `<div class="tp-empty-suggestion" style="margin-top:10px">
           <span>${picks.length === 1 ? onePickCopy : `Nothing worth your time ${isNarrowWindow ? (activeSport === 'darts' ? 'in this window' : 'today') : 'in this window'}. Check ${nextLabel}.`}</span>
           ${picks.length !== 1 ? `<button class="tp-suggest-btn" onclick="setTpWindow('${nextWindow}')">${nextLabel} →</button>` : ''}
         </div>`
      : '';

    if (picks.length === 0) {
      const emptyLine = activeSport === 'darts'
        ? 'No standout sessions this week.'
        : getEmptyPicksLine();
      container.innerHTML = nextWindow
        ? `<div class="tp-empty-suggestion">
             <span>No standout ${activeSport === 'darts' ? 'sessions' : 'games'} ${isNarrowWindow && activeSport !== 'darts' ? 'today' : 'in this window'}.</span>
             <button class="tp-suggest-btn" onclick="setTpWindow('${nextWindow}')">Check ${nextLabel} →</button>
           </div>`
        : `<div class="tp-empty">${emptyLine}</div>`;
      return;
    }

    const editorialLine = getEditorialLine(picks, tpWindow, activeSport);
    const editorialHTML = editorialLine
      ? `<div class="tp-editorial">${editorialLine}</div>`
      : '';

    container.innerHTML = `${editorialHTML}<div class="top-picks-grid">
      ${picks.map((g, i) => {
        // Darts night cards: no matchup, no score reveal, just verdict.
        // The whole point is to recommend the night without naming players.
        if (g.isDartsNight) {
          const watchBtn = g.watch
            ? `<a class="watch-btn" href="${g.watch.url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">🎬 Watch on ${g.watch.name}</a>`
            : '';
          return `
            <div class="top-pick-card ${g.cat.cls}${i === 0 ? ' best-pick' : ''}" style="animation-delay:${i*0.06}s">
              <div class="tp-header-row">
                ${i === 0 ? `<span class="tp-best-pick-badge${g.isFallback ? ' is-fallback' : ''}">${g.isFallback ? '😐 Best Available' : '⭐ Top Session'}</span>` : ''}
                <span class="tp-sport">${g.mergedLabel ? g.mergedLabel + ' · ' + g.league : g.league}</span>
              </div>
              <div class="tp-matchup">${g.date}</div>
              <div class="tp-meta">${g.summary.hint}</div>
              <div class="tp-badge">${g.cat.icon} ${g.cat.label}</div>
              ${watchBtn}
            </div>`;
        }

        const scoreStr = tpScoreStr(g).replace(/"/g, '&quot;');
        const isTennis  = g.sport === 'tennis';
        const isCricket = g.sport === 'cricket';
        // For cricket/tennis the score is a single string; pass it as h with
        // empty a. For other sports pass numeric h and a separately. The
        // string goes into a JS-literal inside an onclick="..."  attribute, so
        // apostrophes inside the score (e.g. team names) need escaping.
        const escapedScore = scoreStr.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const cycleArgs = (isCricket || isTennis)
          ? `'${escapedScore}',''`
          : `${g.h},${g.a}`;
        const insightHTML = buildInsightHTML(g.confidence?.factors, g.sport, cycleArgs, g.espnHeadline);
        const dateLabel = g.date || g.dateStr || '';

        const leagueLabel = g.mergedLabel ? `${g.mergedLabel}${baseLeagueLabel ? ' · ' + baseLeagueLabel : ''}` : baseLeagueLabel;
        // In Top Picks every card is a deliberate recommendation, so show the

        // Main grid keeps the watchworthy-only gate to avoid button overload.
        const watchBtn = (g.watch && !shouldHideWatchProvider(g))
          ? `<a class="watch-btn" href="${g.watch.url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">🎬 Watch on ${g.watch.name}</a>`

  // ── RENDER ─────────────────────────────────────────────────────────────
  function renderGames(sport) {

        filtered = filtered.filter(g => allowed.includes(g.cat.cls));
      }

      if (filtered.length === 0) {
        html += '<p class="no-games">Nothing in this filter right now.</p>';
      } else if (state.football.league === 'all') {

          if (g.ts > byDate[key].maxTs) byDate[key].maxTs = g.ts;

          upcomingHTML += `<div class="section-label">${date}</div>`;
          upcomingHTML += dayGames.map((g,i) => upcomingCardHTML(g,i)).join('');

      let pastHTML = '';
      if (filtered.length === 0) {
        pastHTML += '<p class="no-games">Nothing here right now.</p>';
      } else {
        // Find the best pick — top game by excitement across all dates
        const bestPick = sortByExcitement(filtered)[0];
        const byDate = {};
        filtered.forEach(g => { if(!byDate[g.date]) byDate[g.date]=[]; byDate[g.date].push(g); });
        Object.keys(byDate).sort((a,b) => byDate[b][0].ts - byDate[a][0].ts).forEach(date => {
          pastHTML += `<div class="section-label">${date}</div>`;
          pastHTML += renderDateGames(byDate[date], bestPick, sport);

      // WNBA: upcoming first (broadcast-info utility), then past games
      // Others: past first (catch-up utility), then upcoming
      if (sport === 'wnba') {
        html += upcomingHTML + pastHTML;
      } else {
        html += pastHTML + upcomingHTML;
      }
    }

    container.innerHTML = html;
  }

  // Partition a sorted game list into visible (non-skip + top 2 skip) and
  // hidden (rest of skip). Used by all sport renderers that want Skip
  // collapsing. Returns {visible, hidden}. bestPick is promoted to visible
  // even if it's a Skip game in the hidden tail.
  function partitionSkipCollapse(games, bestPick) {
    const sorted = sortByExcitement(games);
    const isSkip = (g) => g.cat?.cls === 'blowout' || g.cat?.cls === 'defensive';
    const nonSkip = sorted.filter(g => !isSkip(g));
    const skip    = sorted.filter(g => isSkip(g));
    if (skip.length < 4) {
      return { visible: [...nonSkip, ...skip], hidden: [] };
    }
    let visibleSkip = skip.slice(0, 2);
    let hiddenSkip  = skip.slice(2);
    if (bestPick && isSkip(bestPick) && hiddenSkip.includes(bestPick)) {
      hiddenSkip = hiddenSkip.filter(g => g !== bestPick);
      visibleSkip = [bestPick, ...visibleSkip];
    }
    return { visible: [...nonSkip, ...visibleSkip], hidden: hiddenSkip };
  }

  // Render a date-grouped list of games using gameCardHTML. Used by

  function renderDateGames(games, bestPick, sport) {

    let html = '';

    for (const g of visible) {
      html += gameCardHTML(g, renderIdx++, g === bestPick, sport);

      const hiddenHTML = hidden.map(g => gameCardHTML(g, renderIdx++, false, sport)).join('');
      html += `<div class="skip-collapse">
        <button class="skip-collapse-pill" onclick="expandSkipped(this)">+ ${hidden.length} more we'd skip</button>
        <div class="skip-collapse-hidden" style="display:none;">${hiddenHTML}</div>
      </div>`;

  }

  // Expand handler: swaps hidden cards into view and removes the pill.

  // showToast — used for various ephemeral notifications (refresh status,

  let toastTimer;
  function showToast(msg, type = '') {
    const toast = document.getElementById('spoiler-toast');
    toast.textContent = msg;
    toast.classList.remove('toast-error', 'toast-success', 'toast-warn');
    if (type) toast.classList.add(`toast-${type}`);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');

    }, 3000);

  // Reveal buttons are the only spoiler protection now — tapping them is
  // already a deliberate action. Keeping this stub lets old call sites

  function spoilerBlocked(_btn) { return false; }

  function toggleScore(btn, h, a) {
    if (spoilerBlocked(btn)) return;

    if (el.style.display === 'block') { el.style.display='none'; btn.textContent='👁 Reveal'; }
    else { el.textContent=`${h} – ${a}`; el.style.display='block'; btn.textContent='🙈 Hide'; }

  // Three-state reveal cycle: hidden → insights → score → hidden.
  // Insights and score are now independent toggles instead of a single
  // cycling button. Why watch? opens insights (and closes them on second tap);
  // Show Score reveals the score (and hides it). Users can have both visible,
  // either alone, or neither — whatever matches how they want to consume the
  // game.
  function toggleInsights(btn) {
    const card = btn.closest('.game-card, .top-pick-card');
    if (!card) return;
    const insightEl = card.querySelector('.insight-reveal');
    if (!insightEl) return;

    const isVisible = insightEl.style.display === 'flex';
    if (isVisible) {
      // Collapse insights AND any visible score. Score lives outside the
      // insights panel but is conceptually part of the same reveal flow —
      // hiding "Why watch?" should restore the spoiler-free initial state.
      insightEl.style.display = 'none';
      const scoreEl = card.querySelector('.score-reveal, .tp-score');
      if (scoreEl && scoreEl.style.display === 'block') {
        scoreEl.style.display = 'none';
        // Reset the inline Show Score button back to its initial label.
        const scoreBtn = card.querySelector('.insight-score-btn');
        if (scoreBtn) scoreBtn.textContent = 'Show Score →';
      }
      btn.textContent = '👁 Why watch?';
    } else {
      insightEl.style.display = 'flex';
      btn.textContent = '× Hide';
    }
  }

  function toggleScore(btn, h, a) {
    if (spoilerBlocked(btn)) return;
    const card = btn.closest('.game-card, .top-pick-card');
    if (!card) return;
    const scoreEl = card.querySelector('.score-reveal, .tp-score');
    if (!scoreEl) return;

    const isVisible = scoreEl.style.display === 'block';
    if (isVisible) {
      scoreEl.style.display = 'none';
      btn.textContent = 'Show Score →';
    } else {
      const isString = (typeof h === 'string') && (a === undefined || a === '');
      if (isString) {
        scoreEl.style.fontFamily = "'Outfit',sans-serif";
        scoreEl.textContent = h;
      } else {
        scoreEl.textContent = `${h} – ${a}`;

      btn.textContent = '🙈 Hide';

  }

  // Darts uses player-vs-player cards. We deliberately hide round (QF/SF/F)
  // and per-player averages — both would spoil the result for someone who
  // already knows the bracket / who's in the final.
  // Summarize a darts night (or any group of matches) into a single verdict
  // card. Hides individual matchups so users don't see which players advanced
  // through the bracket — that's a structural spoiler the score-reveal can't
  // hide. Returns { cls, label, icon, hint, watch } where watch is the
  // provider info from any match that has it (all matches in a night share
  // the same league, so the provider is the same for all).
  function summarizeNight(games) {
    const mustWatch = games.filter(g => g.cat?.cls === 'scorefest' || g.cat?.cls === 'watchworthy');
    const watchable = games.filter(g => g.cat?.cls === 'watchable');

    // Drama signals at the night level — additive flair that doesn't reveal
    // who did what, just that *something* happened on this night.
    const addons = [];
    const has9Darter = games.some(g => g.debug?.nineDart);
    if (has9Darter) addons.push('9-darter happened');

    const nightAvg = games[0]?.debug?.nightAvg;
    if (nightAvg && nightAvg >= 100) addons.push('high-scoring throughout');

    let cls, icon, label, hint;

    if (mustWatch.length >= 2) {
      cls = 'watchworthy'; icon = '👀'; label = 'Must Watch';
      hint = 'Strong night — multiple matches worth watching';
    } else if (mustWatch.length === 1) {
      cls = 'watchworthy'; icon = '👀'; label = 'Must Watch';
      hint = 'Worth your time — at least one match delivered';
    } else if (watchable.length >= 3) {
      cls = 'watchable'; icon = '😐'; label = 'Watchable';
      hint = 'Solid scoring across the card';
    } else if (watchable.length >= 1) {
      cls = 'watchable'; icon = '😐'; label = 'Watchable';
      hint = 'One or two competitive matches, rest one-sided';
    } else {
      cls = 'blowout'; icon = '⏭'; label = 'Skip';
      hint = 'One-sided across the board';
    }

    if (addons.length > 0) hint += ` (${addons.join(', ')})`;

    // All matches in a night share the same league, so any g.watch will do.
    const watch = games.find(g => g.watch)?.watch || null;

    return { cls, icon, label, hint, watch };
  }

  function renderDarts() {
    const { recent, upcoming } = allData.darts;
    const container = document.getElementById('darts-games');
    if (!container) return;
    const filter = state.darts?.cat || 'all';

    let html = '';

    if (recent.length === 0) {
      html += '<p class="no-games">Nothing here right now.</p>';
    } else {
      // Group by tournament → date. Each (tournament, date) pair is a night
      // that gets summarized to a single card. We deliberately don't show
      // individual match list — seeing the same player name in QF, SF, and F
      // rows would reveal who made the final without any score reveal.
      const byLeague = {};
      recent.forEach(g => {
        if (!byLeague[g.league]) byLeague[g.league] = [];
        byLeague[g.league].push(g);
      });

      Object.entries(byLeague).forEach(([league, games]) => {
        html += `<div class="league-heading">🎯 ${league}</div>`;

        // Group by session if present, else by date. Multi-session days
        // (e.g. World Matchplay's afternoon + evening) need to render as
        // separate cards. The fetcher tags each game with debug.session;
        // if absent (e.g. Premier League — one session per night), fall
        // back to the date string as the bucket key.
        const byBucket = {};
        games.forEach(g => {
          const key = g.debug?.session || g.date;
          if (!byBucket[key]) byBucket[key] = { label: key, games: [] };
          byBucket[key].games.push(g);
        });

        // Most recent first. Use the latest ts in each bucket.
        const sortedBuckets = Object.values(byBucket).sort(
          (a, b) => Math.max(...b.games.map(g => g.ts)) - Math.max(...a.games.map(g => g.ts))
        );

        // Build a list of sessions/nights with their summaries, then apply the
        // category filter at the session level (Must Watch sessions, etc.).
        const nights = sortedBuckets.map(b => ({
          date: b.label,
          games: b.games,
          summary: summarizeNight(b.games),
        }));

        const visibleNights = filter === 'all'
          ? nights
          : nights.filter(n => {
              const allowed = FILTER_CLS_MAP[filter] || [];
              return allowed.includes(n.summary.cls);
            });

        if (visibleNights.length === 0) {
          html += '<p class="no-games">Nothing in this filter right now.</p>';
          return;
        }

        visibleNights.forEach((n, i) => {
          const s = n.summary;
          const watchBtn = (s.cls === 'watchworthy' && s.watch)
            ? `<a class="watch-btn" href="${s.watch.url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">🎬 Watch on ${s.watch.name}</a>`
            : '';
          html += `
            <div class="game-card ${s.cls}" style="animation-delay:${i*0.06}s;flex-wrap:wrap;">
              <div class="teams" style="flex:1;min-width:0;">
                <div class="matchup">${n.date}</div>
                <div class="game-meta">${s.hint}</div>
              </div>
              <div class="cat-badge">${s.icon} ${s.label}</div>
              ${watchBtn}
            </div>`;
        });
      });
    }

    // Upcoming — show by date, no scores to reveal
    if (upcoming && upcoming.length > 0) {
      html += `<div class="upcoming-divider">📅 Coming Up</div>`;
      const byDate = {};
      upcoming.forEach(g => {
        if (!byDate[g.date]) byDate[g.date] = [];
        byDate[g.date].push(g);
      });
      Object.entries(byDate).forEach(([date, dGames]) => {
        html += `<div class="section-label">${date}</div>`;
        html += dGames.map((g, i) => `
          <div class="upcoming-card" style="animation-delay:${i*0.04}s">
            <div class="teams">
              <div class="matchup">${g.home} <span class="vs">vs</span> ${g.away}</div>
              <div class="game-meta">${g.league}</div>
              <div class="kickoff-time">🕐 ${formatGameTime(g.ts)}</div>
            </div>
            <div class="upcoming-badge">📅 Upcoming</div>
          </div>`).join('');
      });
    }

    container.innerHTML = html;
  }

  let activeSport = localStorage.getItem('activeSport') || 'football';

  // Hash routing — spoilerfreescores.com/#cricket lands on cricket tab
  const hashSport = window.location.hash.replace('#', '').toLowerCase();
  const validSports = ['football','cricket','wnba','darts','tennis','nhl','nba','mlb','nfl','ncaaf','softball'];
  if (hashSport && validSports.includes(hashSport)) activeSport = hashSport;

  function switchSport(sport, tabEl) {
    if (hiddenSports.has(sport)) return;
    activeSport = sport;
    localStorage.setItem('activeSport', sport);
    document.querySelectorAll('.sport-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.sport-panel').forEach(p => p.classList.remove('active'));
    tabEl.classList.add('active');
    document.getElementById(`panel-${sport}`)?.classList.add('active');
    renderTopPicks();
    // The pinned "All Sports" tab is a cross-sport Must Watch feed only —
    // there's no single-sport game list or filter set that makes sense
    // underneath it, so hide the ALL GAMES section entirely rather than
    // showing an empty header with nothing below it.
    const allGamesHeader = document.getElementById('all-games-header');
    if (allGamesHeader) allGamesHeader.style.display = (sport === 'all') ? 'none' : '';
    // Re-render inline games for the newly-active sport so Top Pick
    // badges reflect THIS sport's current picks (not whatever was rendered
    // at initial page load before TP picks were known).
    if (sport === 'cricket')      renderCricket();
    else if (sport === 'tennis')  renderTennis();
    else if (sport === 'darts')   renderDarts();
    else if (sport === 'all')     { /* no inline panel for the merged view */ }
    else                          renderGames(sport);
  }

  if (location.protocol === 'file:') {
    const _origFetch = window.fetch;
    window.fetch = (url, ...args) => {
      if (typeof url === 'string' && url.includes('get-scores')) {
        const emptyData = {};
        ['soccer','nhl','mlb','nba','wnba','nfl','ncaaf','cricket','tennis','darts','softball','cs2'].forEach(k => { emptyData[k] = { recent: [], upcoming: [] }; });
        return Promise.resolve(new Response(JSON.stringify(emptyData), { status: 200, headers: { 'Content-Type': 'application/json' } }));
      }
      return _origFetch(url, ...args);
    };
  }

  loadScores();

  // PWA service worker registration
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

</script>
